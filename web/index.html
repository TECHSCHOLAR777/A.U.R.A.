<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AURA">
<meta name="theme-color" content="#1B3A2D">
<meta name="description" content="Offline-first voice assistant for Anganwadi workers. No password, works in tribal dialects.">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<title>A.U.R.A.</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Noto+Sans+Devanagari:wght@400;500;700&display=swap" rel="stylesheet">
<!-- Import map so vision_engine.js can use onnxruntime-web as an ES module -->
<script type="importmap">
{
  "imports": {
    "onnxruntime-web": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/esm/ort.all.min.js"
  }
}
</script>
<style>
:root{
  --forest:#1B3A2D;--forest-d:#11261C;--green:#216A3F;--red:#C0392B;
  --amber:#CC6A1A;--orange:#D67424;--purple:#6B5296;--navy:#13384D;
  --ink:#161616;--muted:#6B6B6B;--line:#E2E2E2;--card:#F6F6F6;
  --bg:#FFFFFF;--rl:#FCEBE9;--al:#FCF3E3;--gl:#E9F3EC;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Responsive Layout */
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;background:#0f172a;color:var(--ink);
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0;padding:0}
.hindi *{font-family:'Noto Sans Devanagari','Inter',sans-serif}
/* offline/update banners */
#net-banner{display:none;position:fixed;top:0;left:0;right:0;z-index:999;
  background:var(--amber);color:#fff;text-align:center;font-size:12px;font-weight:700;
  padding:10px;letter-spacing:.3px}
#update-banner{display:none;position:fixed;top:0;left:0;right:0;z-index:998;
  background:var(--forest);color:#fff;text-align:center;font-size:12px;font-weight:600;
  padding:10px;cursor:pointer}
/* responsive app wrapper */
.phone{width:100%;height:100vh;height:100dvh;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg);overflow:hidden}
.screen.active{display:flex}
.screen.dark{background:var(--forest)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden}.scroll::-webkit-scrollbar{width:0}
svg{width:20px;height:20px;flex-shrink:0;display:block}
.nav .tab svg{width:22px;height:22px}.nav .fab svg{width:26px;height:26px}
.rings svg{width:42px;height:42px}.dark .logo svg,.dark .emblem svg{width:40px;height:40px}
.globewrap svg{width:30px;height:30px}
.statusbar{height:42px;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;font-size:13px;font-weight:600;flex-shrink:0}
.statusbar .r{color:var(--muted);font-size:11px;font-weight:500}
.header{height:54px;display:flex;align-items:center;padding:0 18px;gap:10px;flex-shrink:0}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--forest);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;position:relative;cursor:pointer}
.avatar::after{content:'';position:absolute;right:-3px;bottom:-2px;width:13px;height:13px;
  border-radius:50%;background:var(--navy);border:2px solid #fff}
.brand{font-size:18px;font-weight:800;color:var(--forest);letter-spacing:.5px}
.header .right{margin-left:auto;display:flex;align-items:center;gap:12px}
.pill-lang{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--forest)}
.header-sync-pill{font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:2px;cursor:pointer}
.header-sync-pill.synced{color:#4caf80}
.header-sync-pill.queued{color:var(--amber)}
.header-sync-pill.offline{color:#888}
.header-back{background:none;border:none;color:var(--forest);font-size:26px;font-weight:700;cursor:pointer;padding-right:8px;line-height:1;display:flex;align-items:center}
.body{padding:0 20px 84px} /* padded bottom to prevent overlapping with bottom nav */
.greet{font-size:16px;color:var(--muted);margin-top:8px}
.greet small{display:block;font-size:13px;margin-top:2px}
.kw{margin:18px 0 4px;font-size:23px;font-weight:800;line-height:1.3}
.kw .hl{color:#fff;padding:1px 10px;border-radius:7px;display:inline-block}
.sub{font-size:12px;color:var(--muted);margin:6px 0 14px;line-height:1.5}
.nowcard{background:var(--forest);border-radius:18px;padding:18px;color:#fff}
.nowcard .nlabel{font-size:11px;color:#9fc3b1;font-weight:600;letter-spacing:.4px}
.nowcard .nclock{font-size:11px;color:#bcd8cb;display:flex;align-items:center;gap:6px;margin-bottom:10px}
.nowcard .nclock svg{width:14px;height:14px}
.nowcard h2{font-size:25px;font-weight:800;margin-top:2px}
.nowcard .ntask{font-size:14px;color:#d7ece1;margin-top:4px}
.nowbtn{margin-top:16px;background:var(--green);color:#fff;border:none;border-radius:11px;
  width:100%;padding:13px;font-size:15px;font-weight:700;cursor:pointer;
  font-family:inherit;display:flex;align-items:center;justify-content:space-between}
.alert{display:flex;align-items:center;gap:12px;background:var(--rl);border:1px solid var(--red);
  border-left:4px solid var(--red);border-radius:11px;padding:13px 14px;margin-top:16px;
  cursor:pointer;color:var(--red)}
.alert .ai{width:22px;height:22px;flex-shrink:0;color:var(--red)}
.alert .ai svg{width:22px;height:22px}
.alert .t{font-size:13px;font-weight:700;color:var(--red);flex:1;line-height:1.35}
.alert .chev{color:var(--red);font-weight:700;flex-shrink:0}
.sectionlabel{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.5px;margin:22px 0 10px}
.slot{display:flex;align-items:center;gap:12px;border:1px solid var(--line);
  border-left:4px solid var(--line);border-radius:11px;padding:11px 12px;
  margin-bottom:9px;background:var(--card);cursor:pointer;transition:transform .12s}
.slot:hover{transform:translateX(2px)}
.slot.now{background:#fff;border:2px solid var(--green);border-left:4px solid var(--green)}
.slot .dot{width:30px;height:30px;border-radius:50%;background:#e3e3e3;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:#fff}
.slot .dot svg{width:16px;height:16px}
.slot.now .dot{background:var(--green)}
.slot .meta{flex:1}
.slot .meta .a{font-size:13px;font-weight:700;color:var(--muted)}
.slot.now .meta .a{color:var(--ink)}
.slot .meta .b{font-size:10px;color:var(--muted);margin-top:1px}
.slot .nowtag{background:var(--green);color:#fff;font-size:9px;font-weight:700;
  padding:4px 9px;border-radius:11px}
.blockh{display:flex;align-items:center;gap:8px;padding:8px 14px;border-left:6px solid;margin:0 -20px}
.blockh .num{font-size:12px;font-weight:800}
.blockh .ti{font-size:13px;font-weight:700}
.blockh .su{margin-left:auto;font-size:9px;font-weight:500}
.crow{display:flex;gap:12px;border:1px solid var(--line);border-left:4px solid;
  border-radius:11px;padding:11px 12px;margin:9px 0;background:#fff;cursor:pointer;align-items:flex-start}
.crow .ic{width:20px;height:20px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;margin-top:2px}
.crow .info{flex:1}
.crow .info .nm{font-size:14px;font-weight:700}
.crow .info .ag{font-size:9px;color:var(--muted);margin:2px 0}
.crow .info .ds{font-size:10px;line-height:1.45}
.crow .tag{font-size:8px;font-weight:600;padding:3px 8px;border-radius:9px;height:fit-content;white-space:nowrap}
.transcript{background:#fff;border:2px solid var(--green);border-left:4px solid var(--green);
  border-radius:13px;padding:14px;margin-bottom:16px}
.transcript .q{font-size:14px;line-height:1.5}
.transcript .h{font-size:9px;font-weight:600;color:var(--green);margin-top:10px}
.bar{height:4px;background:#e6e6e6;border-radius:2px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);width:94%}
.reg{display:flex;align-items:center;border-radius:11px;padding:10px 12px;margin-bottom:9px;border-left:4px solid}
.reg .l{font-size:9px;font-weight:600}
.reg .v{font-size:13px;font-weight:700;color:var(--ink)}
.reg .st{margin-left:auto;font-size:8px;font-weight:600;color:#fff;padding:4px 11px;border-radius:10px}
.tier{display:flex;align-items:center;border-radius:11px;padding:10px 12px;margin-bottom:9px;
  border-left:4px solid var(--line);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.tier.on{border:1px solid;border-left:4px solid}
.tier .tl{font-size:12px;font-weight:700}
.tier .td{font-size:9px;color:var(--muted)}
.tier .ck{margin-left:auto;width:20px;height:20px;border-radius:50%;color:#fff;
  display:flex;align-items:center;justify-content:center}
.tier .ck svg{width:12px;height:12px}
.hero{border-radius:14px;padding:16px;color:#fff}
.hero h2{font-size:22px;font-weight:800}
.hero p{font-size:12px;margin-top:4px;opacity:.9}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.vital{border:1px solid var(--line);border-radius:12px;padding:12px}
.vital .l{font-size:9px;color:var(--muted)}
.vital .v{font-size:16px;font-weight:800;margin-top:3px}
.vital .d{font-size:9px;margin-top:3px}
.btn{border:none;border-radius:11px;padding:13px;font-size:14px;font-weight:700;
  cursor:pointer;font-family:inherit;width:100%}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--forest);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:#fff;border:1.5px solid var(--forest);color:var(--forest)}
.btn.outline{background:#fff;border:1px solid var(--line);color:var(--muted)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.vcard{border:1px solid var(--line);border-left:4px solid;border-radius:11px;padding:12px;margin-bottom:9px}
.vcard .mh{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.vcard .mh svg{width:18px;height:18px}
.listrow{display:flex;align-items:center;border:1px solid var(--line);border-radius:11px;
  padding:13px;margin-bottom:9px}
.listrow .l{font-size:11px;color:var(--muted)}
.listrow .v{margin-left:auto;font-size:13px;font-weight:700}
.item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);
  border-left:4px solid;border-radius:10px;padding:10px 12px;margin-bottom:8px}
.item .b{width:14px;height:14px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:8px;font-weight:800;color:#fff;flex-shrink:0}
.item .x{font-size:10px;line-height:1.4}
.camline{background:#161616;border-radius:11px;padding:12px;margin-top:12px;
  display:flex;gap:10px;align-items:center}
.camline .ci{width:20px;height:20px;flex-shrink:0;color:#8fe6c0}
.nav{height:70px;background:#fff;border-top:1px solid var(--line);display:flex;
  position:relative;flex-shrink:0}
.nav .tab{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;cursor:pointer;color:var(--muted);position:relative}
.nav .tab.on{color:var(--forest)}
.nav .tab.on::before{content:'';position:absolute;top:0;width:32px;height:3px;
  background:var(--forest);border-radius:2px}
.nav .tab .lab{font-size:9px;font-weight:600}
.nav .fab{position:absolute;left:50%;top:-22px;transform:translateX(-50%);
  width:58px;height:58px;border-radius:50%;background:var(--forest);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(27,58,45,.45);cursor:pointer;border:4px solid #fff}
.nav .fab svg{color:#fff}
.navspacer{flex:1.4}
.screen.dark{justify-content:center;align-items:center;text-align:center;padding:0 32px;
  position:absolute;inset:0}
.dark::before{content:'';position:absolute;top:-80px;left:50%;transform:translateX(-50%);
  width:380px;height:380px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.05),transparent 70%)}
.dark .emblem{width:104px;height:104px;border-radius:50%;background:var(--forest-d);
  display:flex;align-items:center;justify-content:center;margin-bottom:30px;
  box-shadow:0 0 0 1px rgba(255,255,255,.12),0 0 0 11px rgba(255,255,255,.04);
  position:relative;z-index:1}
.dark .emblem svg{width:42px;height:42px;color:#fff}
.dark .logo{width:88px;height:88px;border-radius:50%;background:var(--forest-d);
  display:flex;align-items:center;justify-content:center;margin-bottom:28px;
  box-shadow:0 0 0 1px rgba(255,255,255,.12),0 0 0 11px rgba(255,255,255,.04)}
.dark h1{font-size:50px;font-weight:800;letter-spacing:4px;line-height:1;color:#fff}
.dark .fullform{font-size:11px;color:#9fc3b1;margin-top:12px;letter-spacing:2px;
  text-transform:uppercase;font-weight:600}
.dark .rule{width:42px;height:2px;background:rgba(255,255,255,.22);border-radius:2px;margin:24px 0}
.dark .chip{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.22);
  border-radius:20px;padding:6px 14px;font-size:11px;font-weight:600;color:#cfe3d8}
.dark .chip .pulse{width:7px;height:7px;border-radius:50%;background:#6fd29b;
  animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(111,210,155,.5)}70%{box-shadow:0 0 0 8px rgba(111,210,155,0)}100%{box-shadow:0 0 0 0 rgba(111,210,155,0)}}
.dark .tag{font-size:13px;color:#9fc3b1;margin-top:10px;max-width:240px}
.dark .startbtn{margin-top:34px;background:#fff;color:var(--forest);border:none;
  border-radius:30px;padding:17px 38px;font-size:16px;font-weight:700;cursor:pointer;
  font-family:inherit;display:flex;align-items:center;gap:11px;
  box-shadow:0 10px 24px rgba(0,0,0,.22);position:relative;z-index:1}
.dark .startbtn svg{width:20px;height:20px}
.dark .fine{font-size:12px;color:#8fb9a3;margin-top:22px;max-width:250px;line-height:1.5}
.dark .govstrip{position:absolute;bottom:26px;left:0;right:0;font-size:10.5px;color:#5f8a73;letter-spacing:.4px}
.rings{width:180px;height:180px;border-radius:50%;background:var(--gl);display:flex;
  align-items:center;justify-content:center;margin:30px auto}
.rings .r2{width:132px;height:132px;border-radius:50%;background:#d3e8da;display:flex;
  align-items:center;justify-content:center}
.rings .r3{width:88px;height:88px;border-radius:50%;background:var(--forest);display:flex;
  align-items:center;justify-content:center}
.rings.listening .r3{animation:pulse 1s infinite}
.globewrap{width:60px;height:60px;border-radius:50%;background:var(--gl);display:flex;
  align-items:center;justify-content:center;margin:0 auto;color:var(--green)}
.profilecard{border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center;margin:16px 0}
.profilecard .pa{width:84px;height:84px;border-radius:50%;background:var(--forest);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;margin:0 auto 14px}
.profilecard h3{font-size:20px;font-weight:800}
.profilecard .role{font-size:11px;color:var(--muted);margin-top:2px}
.langlist .lr{display:flex;align-items:center;border:1px solid var(--line);
  border-radius:11px;padding:13px;margin-bottom:9px;cursor:pointer}
.langlist .lr.on{border:1.5px solid var(--green);border-left:4px solid var(--green);background:var(--gl)}
.langlist .lr .nm{font-size:13px;font-weight:600}
.langlist .lr.on .nm{font-weight:700}
.langlist .lr .ck{margin-left:auto;width:20px;height:20px;border-radius:50%;
  background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center}
.langlist .lr .ck svg{width:12px;height:12px}
.backbtn{position:absolute;top:48px;left:14px;z-index:20;background:rgba(255,255,255,.9);
  border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:12px;
  font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink)}
/* loading overlay */
.loading-overlay{position:absolute;inset:0;background:rgba(27,58,45,.7);
  display:none;align-items:center;justify-content:center;z-index:100;border-radius:0}
.loading-overlay.show{display:flex}
.spinner{width:44px;height:44px;border:4px solid rgba(255,255,255,.2);
  border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{font-size:11px;color:#aaa;text-align:center;margin-top:12px;max-width:430px;line-height:1.6}

/* Desktop card design */
@media (min-width: 480px) {
  body {
    background: #0f172a;
    padding: 20px 0;
  }
  .phone {
    width: 430px;
    height: 880px;
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    border: 8px solid #1e293b;
  }
  .loading-overlay {
    border-radius: 24px;
  }
}
.pulse-icon.recording {
  animation: pulse-ring 1.5s infinite;
}
@keyframes pulse-ring {
  0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
  70% { transform: scale(1); box-shadow: 0 0 0 16px rgba(239, 68, 68, 0); }
  100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
}
</style>
</head>
<body>

<div id="net-banner">You are offline: data is saved locally and will sync when connected</div>
<div id="update-banner" onclick="updateSW()">New version available: tap to update</div>

<div class="phone" id="phone">
  <div id="app"></div>
  <div class="loading-overlay" id="loader"><div class="spinner"></div></div>
</div>

<p class="hint" id="hint"></p>

<!-- ASR Transcription Modal -->
<div id="asr-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,0.9);z-index:9999;align-items:center;justify-content:center;color:#fff;font-family:inherit">
  <div style="text-align:center;padding:24px;width:85%;max-width:340px;background:#1e293b;border-radius:24px;border:1.5px solid rgba(255,255,255,0.1)">
    <div id="asr-pulse" class="pulse-icon recording" style="width:70px;height:70px;border-radius:50%;background:var(--red);margin:0 auto 20px;display:flex;align-items:center;justify-content:center">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" style="width:34px;height:34px;color:#fff">
        <path d="M10 2C8.3 2 7 3.3 7 5V10C7 11.7 8.3 13 10 13S13 11.7 13 10V5C13 3.3 11.7 2 10 2Z"/>
        <path d="M5 10C5 13.5 7.4 16 10 16S15 13.5 15 10"/>
        <path d="M10 16V19M7 19H13"/>
      </svg>
    </div>
    <h3 id="asr-title" style="font-size:18px;font-weight:800;margin-bottom:8px">Listening...</h3>
    <p id="asr-subtitle" style="font-size:12px;color:rgba(255,255,255,0.7);margin-bottom:20px;line-height:1.5">Speak clearly into the microphone</p>
    <button id="asr-stop-btn" class="btn red" style="margin:0;width:100%;padding:14px">Stop Recording</button>
  </div>
</div>

<script src="aura-api.js"></script>
<script src="ml_pipeline/ml_inference.js"></script>
<script>
/* SECTIONS 1-3 (AURA_API, AURA_DB, MOCK) now live in aura-api.js,
   loaded as a separate script before this one. Edit that file to wire the backend. */

/* ============================================================
   SECTION 4 — APP STATE
   ============================================================ */
let lang = 'hi';
const BUILD = 'build 8';
let stack = ['vl1'];
let currentWorker = null;   // the logged-in worker (drives the whole dashboard)
let pendingWorker = null;   // worker matched at login, awaiting confirmation
let liveText = '';          // live speech transcript
let heardFinal = '';        // final recognized text
let recog = null;           // SpeechRecognition instance
let recogState = 'idle';    // idle | listening | matched | nomatch | error | unsupported

// Dynamic Session State for features tracking (Feature 12)
window.SESSION = {
  presentCount: 4,
  absentCount: 1,
  presentIds: ['JH-001', 'JH-002', 'JH-003', 'JH-005'],
  absentIds: ['JH-004'],
  fedCount: 18,
  totalPresent: 24,
  referralLogged: 0
};

// Resolve a { en, hi } object by current language
function L(obj){ if(obj == null) return ''; if(typeof obj === 'string') return obj; return lang === 'hi' ? (obj.hi ?? obj.en) : (obj.en ?? obj.hi); }
// Current worker (never null once logged in; default to first for safety)
function CW(){ return currentWorker || WORKERS[0]; }

// Match what the worker said against the WORKERS dataset
function matchWorker(text){
  const t = (text || '').toLowerCase();
  return WORKERS.find(w => w.match.some(k => t.includes(k.toLowerCase()))) || null;
}

function detectLanguage(text) {
  const t = (text || '').toLowerCase();
  if (/[\u0900-\u097F]/.test(t)) {
    return 'hi';
  }
  const hinglishKeywords = ['mera', 'naam', 'char', 'chaar', 'khunti', 'munda', 'soren', 'oraon', 'devi', 'kumari', 'sunita', 'phoolmani', 'rekha'];
  const englishKeywords = ['my', 'name', 'is', 'center', 'centre', 'four', 'block'];
  
  let hiCount = 0;
  let enCount = 0;
  for (const kw of hinglishKeywords) {
    if (t.includes(kw)) hiCount++;
  }
  for (const kw of englishKeywords) {
    if (t.includes(kw)) enCount++;
  }
  
  if (hiCount > enCount) return 'hi';
  if (enCount > hiCount) return 'en';
  
  return lang || 'en';
}

let loginRecorder = null;
let loginAudioChunks = [];
let loginRecordingTimeout = null;

// Unified Whisper-based speech recognition for login
async function startRecognition(){
  liveText = '';
  heardFinal = '';
  pendingWorker = null;
  recogState = 'listening';
  updateLiveTranscript();

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    loginRecorder = new MediaRecorder(stream);
    loginAudioChunks = [];

    loginRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) loginAudioChunks.push(e.data);
    };

    loginRecorder.onstop = async () => {
      const audioBlob = new Blob(loginAudioChunks, { type: 'audio/wav' });
      stream.getTracks().forEach(t => t.stop());

      recogState = 'processing';
      updateLiveTranscript();

      try {
        const res = await AURA_API.transcribeVoice(audioBlob, 'auto');
        if (res && res.text) {
          liveText = res.text;
          const detectedLang = detectLanguage(liveText);
          setLang(detectedLang);

          const w = matchWorker(liveText);
          if (w) {
            pendingWorker = w;
            recogState = 'matched';
            updateLiveTranscript();
            setTimeout(() => go('vl3'), 800);
          } else {
            recogState = 'nomatch';
            updateLiveTranscript();
          }
        } else {
          recogState = 'nomatch';
          updateLiveTranscript();
        }
      } catch (err) {
        console.error('[Login ASR] error:', err);
        recogState = 'error';
        updateLiveTranscript();
      }
    };

    loginRecorder.start();
    loginRecordingTimeout = setTimeout(() => {
      stopRecognition();
    }, 6000); // Record up to 6 seconds
  } catch (err) {
    console.error('[Login ASR] mic error:', err);
    recogState = 'error';
    updateLiveTranscript();
  }
}

function stopRecognition(){
  if (loginRecordingTimeout) clearTimeout(loginRecordingTimeout);
  if (loginRecorder && loginRecorder.state === 'recording') {
    loginRecorder.stop();
  }
}

// Update the listening screen's live text + status without re-rendering (keeps mic alive)
function updateLiveTranscript(){
  const el = document.getElementById('live-text'); if(el) el.textContent = liveText || '…';
  const st = document.getElementById('live-status');
  if(st){
    const map = {
      listening: { en:'Listening…', hi:'सुन रहे हैं…' },
      processing: { en:'Processing voice with Whisper...', hi:'आवाज़ पहचानी जा रही है (Whisper)...' },
      matched:   { en:'Got it ✓', hi:'मिल गया ✓' },
      nomatch:   { en:'Did not catch a name. Say again, or tap your name below.', hi:'नाम समझ नहीं आया। फिर बोलो, या नीचे अपना नाम चुनो।' },
      error:     { en:'Microphone blocked. Tap your name below instead.', hi:'माइक बंद है। नीचे अपना नाम चुनो।' }
    };
    st.textContent = L(map[recogState] || map.listening);
    st.style.color = (recogState === 'matched') ? 'var(--green)' : ((recogState === 'listening' || recogState === 'processing') ? 'var(--forest)' : 'var(--red)');
  }
  const ring = document.getElementById('live-ring');
  if(ring) ring.classList.toggle('listening', recogState === 'listening');
}

function pickWorker(id){ pendingWorker = WORKERS.find(w => w.id === id) || WORKERS[0]; go('vl4'); }
window.CHILDREN_ROSTER = [];

function toggleChildAttendance(id) {
  if (!window.SESSION.absentIds) window.SESSION.absentIds = [];
  if (!window.SESSION.presentIds) window.SESSION.presentIds = [];
  const absIdx = window.SESSION.absentIds.indexOf(id);
  if (absIdx !== -1) {
    window.SESSION.absentIds.splice(absIdx, 1);
    if (!window.SESSION.presentIds.includes(id)) window.SESSION.presentIds.push(id);
  } else {
    const presIdx = window.SESSION.presentIds.indexOf(id);
    if (presIdx !== -1) window.SESSION.presentIds.splice(presIdx, 1);
    if (!window.SESSION.absentIds.includes(id)) window.SESSION.absentIds.push(id);
  }
  window.SESSION.presentCount = window.SESSION.presentIds.length;
  window.SESSION.absentCount = window.SESSION.absentIds.length;
  window.SESSION.totalPresent = window.SESSION.presentCount;
  render();
}


function L_Hi(ageStr) {
  if (!ageStr) return '';
  return ageStr.replace('yrs', 'साल').replace('mos', 'महीने').replace('years', 'साल').replace('months', 'महीने');
}

async function confirmWorker(){
  currentWorker = pendingWorker || WORKERS[0];
  showLoader();
  try {
    const list = await AURA_API.getChildren(currentWorker.centre);
    window.CHILDREN_ROSTER = list;
    
    // Initialize SESSION state based on actual database roster
    window.SESSION.presentIds = list.map(c => c.id);
    window.SESSION.absentIds = [];
    window.SESSION.presentCount = list.length;
    window.SESSION.absentCount = 0;
    window.SESSION.totalPresent = list.length;
    window.SESSION.fedCount = Math.round(list.length * 0.75);
  } catch (err) {
    console.error('[confirmWorker] failed to fetch children:', err);
    window.CHILDREN_ROSTER = MOCK.children;
  }
  hideLoader();
  jump('vl5');
}

// Type a name directly: match a seeded worker, else log in under the typed name
function typedLogin(){
  const el = document.getElementById('name-input');
  const val = (el && el.value || '').trim();
  if(!val) return;
  const w = matchWorker(val);
  if(w){ pendingWorker = w; }
  else {
    const base = WORKERS[0];   // representative centre data under the typed name
    pendingWorker = { ...base, id:'AWW_TYPED', custom:true,
      av: val.charAt(0).toUpperCase(), name: { en: val, hi: val } };
  }
  stopRecognition();
  go('vl4');
}

   ============================================================ */
function go(id){ stack.push(id); render(); }
function back(){ if(stack.length>1){ stack.pop(); render(); } }
function jump(id){ stack=[id]; render(); }
function setLang(l){
  lang=l;
  const btnHi = document.getElementById('lang-hi');
  const btnEn = document.getElementById('lang-en');
  if(btnHi) btnHi.classList.toggle('on',l==='hi');
  if(btnEn) btnEn.classList.toggle('on',l==='en');
  document.documentElement.lang = l==='hi'?'hi':'en';
  render();
  updateSyncPill();
}
function toggleLanguage(){
  setLang(lang==='hi'?'en':'hi');
}
function showLoader(){ document.getElementById('loader').classList.add('show'); }
function hideLoader(){ document.getElementById('loader').classList.remove('show'); }
async function callAPI(fn, ...args){
  showLoader();
  try { const r = await fn(...args); hideLoader(); return r; }
  catch(e){ hideLoader(); console.error('[API]', e); return null; }
}

// ─── ASR (Whisper Tiny) Recording Helpers ──────────────────────────────────
let mediaRecorder = null;
let audioChunks = [];
let recordingTimeout = null;

function showASRModal(onStopClick) {
  const modal = document.getElementById('asr-modal');
  const title = document.getElementById('asr-title');
  const subtitle = document.getElementById('asr-subtitle');
  const stopBtn = document.getElementById('asr-stop-btn');
  const pulse = document.getElementById('asr-pulse');

  if (modal) modal.style.display = 'flex';
  if (title) title.textContent = lang === 'hi' ? 'सुन रहे हैं...' : 'Listening...';
  if (subtitle) subtitle.textContent = lang === 'hi' ? 'माइक्रोफोन में स्पष्ट रूप से बोलें' : 'Speak clearly into the microphone';
  if (pulse) pulse.className = 'pulse-icon recording';
  
  if (stopBtn) {
    stopBtn.onclick = () => {
      if (typeof onStopClick === 'function') onStopClick();
    };
    stopBtn.textContent = lang === 'hi' ? 'रिकॉर्डिंग रोकें' : 'Stop Recording';
  }
}

function hideASRModal() {
  const modal = document.getElementById('asr-modal');
  if (modal) modal.style.display = 'none';
}

function showASRStatus(statusText) {
  const title = document.getElementById('asr-title');
  const subtitle = document.getElementById('asr-subtitle');
  const pulse = document.getElementById('asr-pulse');

  if (title) title.textContent = statusText;
  if (subtitle) subtitle.textContent = lang === 'hi' ? 'कृपया प्रतीक्षा करें...' : 'Please wait...';
  if (pulse) pulse.className = 'pulse-icon'; // stop pulsing
}

async function startAudioRecording(targetCallback, targetLang = 'hi') {
  audioChunks = [];
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    
    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) audioChunks.push(e.data);
    };
    
    mediaRecorder.onstop = async () => {
      const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
      stream.getTracks().forEach(t => t.stop());
      
      showASRStatus(lang === 'hi' ? '⏳ आवाज़ को शब्दों में बदला जा रहा है...' : '⏳ Transcribing with Whisper...');
      
      try {
        const { transcribeAudioBlob } = await import('./ml_pipeline/whisper_engine.js');
        const res = await transcribeAudioBlob(audioBlob, targetLang, (progress) => {
          if (progress < 100) {
            showASRStatus(lang === 'hi' 
              ? `⏳ ऑफलाइन इंजन लोड हो रहा है: ${Math.round(progress)}%` 
              : `⏳ Loading offline voice engine: ${Math.round(progress)}%`);
          } else {
            showASRStatus(lang === 'hi' 
              ? `⏳ आवाज़ पहचानी जा रही है...` 
              : `⏳ Transcribing audio...`);
          }
        });
        
        hideASRModal();
        if (res.success && res.text) {
          targetCallback(res.text);
        } else {
          console.warn('[ASR] Whisper transcribing failed, using callback with empty/null');
          targetCallback(null);
        }
      } catch (err) {
        console.error('[ASR] Whisper pipeline execution error:', err);
        hideASRModal();
        targetCallback(null);
      }
    };
    
    showASRModal(() => {
      stopAudioRecording();
    });
    
    mediaRecorder.start();
    console.log('[ASR] Recording mic started...');
    
    recordingTimeout = setTimeout(() => {
      stopAudioRecording();
    }, 7000); // Record up to 7 seconds
    
  } catch (err) {
    console.error('[ASR] Mic access error:', err);
    alert(lang === 'hi' ? 'माइक खोलने में असमर्थ। अनुमति जांचें।' : 'Microphone blocked. Check permission.');
  }
}

function stopAudioRecording() {
  if (recordingTimeout) clearTimeout(recordingTimeout);
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
  }
}

async function handleVoiceSARR(){
  // Trigger client-side Whisper ASR recording
  startAudioRecording(async (text) => {
    const finalTranscript = text || T[lang].voiceQ; // fallback to static mock if empty/failed
    window.sarrTranscript = finalTranscript;

    // Call SARR API with actual transcription
    const sarr = await callAPI(AURA_API.runSARR, { 
      transcript: finalTranscript, 
      centreId: CW().centre || 'AWC_04' 
    });

    if (sarr && sarr.registers) {
      console.log('[SARR result]', sarr.registers);
      window.sarrRegisters = sarr.registers;

      // Update attendance session dynamically based on SARR results
      const attReg = sarr.registers.find(r => r.name === 'Attendance');
      if (attReg && attReg.status === 'approved') {
        const childName = attReg.value.split(':')[0].trim();
        const roster = window.CHILDREN_ROSTER && window.CHILDREN_ROSTER.length > 0 ? window.CHILDREN_ROSTER : MOCK.children;
        const found = roster.find(c => c.name.toLowerCase() === childName.toLowerCase() || c.nameHi === childName);
        if (found) {
          if (!window.SESSION.absentIds) window.SESSION.absentIds = [];
          if (!window.SESSION.presentIds) window.SESSION.presentIds = [];
          
          if (!window.SESSION.absentIds.includes(found.id)) {
            window.SESSION.absentIds.push(found.id);
          }
          const pIdx = window.SESSION.presentIds.indexOf(found.id);
          if (pIdx !== -1) {
            window.SESSION.presentIds.splice(pIdx, 1);
          }
          window.SESSION.presentCount = window.SESSION.presentIds.length;
          window.SESSION.absentCount = window.SESSION.absentIds.length;
          window.SESSION.totalPresent = window.SESSION.presentCount;
        }
      }
    }
    render();
  }, lang);
}

async function handleAttendanceCameraCapture() {
  let input = document.getElementById('attendance-photo-input');
  if (!input) {
    input = document.createElement('input');
    input.id = 'attendance-photo-input';
    input.type = 'file';
    input.accept = 'image/*';
    input.capture = 'environment';
    input.style.display = 'none';
    document.body.appendChild(input);
  }

  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    // Update UI to processing state
    const titleEl = document.getElementById('camline-title');
    const subtitleEl = document.getElementById('camline-subtitle');
    const btnEl = document.getElementById('camline-btn');

    if (titleEl) titleEl.textContent = lang === 'hi' ? 'तस्वीर लोड हो रही है...' : 'Loading photo...';
    if (subtitleEl) subtitleEl.textContent = lang === 'hi' ? 'कृपया प्रतीक्षा करें' : 'Please wait';

    const img = new Image();
    const url = URL.createObjectURL(file);
    img.src = url;

    img.onload = async () => {
      URL.revokeObjectURL(url);

      const canvas = document.createElement('canvas');
      const maxDim = 640;
      let w = img.width;
      let h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w > h) {
          h = Math.round(h * maxDim / w);
          w = maxDim;
        } else {
          w = Math.round(w * maxDim / h);
          h = maxDim;
        }
      }
      canvas.width = w;
      canvas.height = h;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);

      if (titleEl) titleEl.textContent = lang === 'hi' ? 'YOLOv8 मॉडल चल रहा है...' : 'Running YOLOv8 model...';
      if (subtitleEl) subtitleEl.textContent = lang === 'hi' ? 'बच्चों की गणना की जा रही है' : 'Detecting children...';

      try {
        const result = await AURA_API.countHeadsByCamera(canvas);
        console.log('[YOLOv8 Headcount]', result);

        window.SESSION.photoCount = result.count;
        window.SESSION.photoConfidence = result.confidence;

        const registeredCount = window.SESSION.presentCount || 24;

        if (titleEl) {
          titleEl.textContent = lang === 'hi'
            ? `फोटो से गिना: ${result.count} बच्चे दिखे`
            : `Counted by photo: ${result.count} seen`;
        }
        if (subtitleEl) {
          const confPct = Math.round(result.confidence * 100);
          if (result.count === registeredCount) {
            subtitleEl.textContent = lang === 'hi'
              ? `रजिस्टर से मेल खाता है (सटीकता: ${confPct}%)`
              : `Matches register (confidence: ${confPct}%)`;
          } else {
            subtitleEl.textContent = lang === 'hi'
              ? `अंतर: फोटो में ${result.count} vs रजिस्टर में ${registeredCount} (सटीकता: ${confPct}%)`
              : `Mismatch: ${result.count} in photo vs ${registeredCount} in register (confidence: ${confPct}%)`;
          }
        }
        if (btnEl) {
          if (result.count === registeredCount) {
            btnEl.style.background = '#1e5235';
            btnEl.style.borderColor = '#2a704a';
          } else {
            btnEl.style.background = '#854c1d';
            btnEl.style.borderColor = '#ad662b';
          }
        }
      } catch (err) {
        console.error('[YOLOv8 Error]', err);
        if (titleEl) titleEl.textContent = lang === 'hi' ? 'गणना विफल रही' : 'Verification failed';
        if (subtitleEl) subtitleEl.textContent = err.message;
      }
    };
  };

  input.click();
}
async function handleLogMeal(){
  startAudioRecording(async (text) => {
    // Extract fed count from voice transcript
    const roster = (window.CHILDREN_ROSTER && window.CHILDREN_ROSTER.length > 0) ? window.CHILDREN_ROSTER : MOCK.children;
    const rosterCount = roster.length;
    let fedCount = Math.round(rosterCount * 0.75); // default to 75%
    if (text) {
      const txt = text.toLowerCase();
      const numPattern = txt.match(/\d+/);
      if (txt.includes('सब') || txt.includes('सभी') || txt.includes('पूरा') || txt.includes('all') || txt.includes('everyone') || txt.includes(String(rosterCount))) {
        fedCount = rosterCount;
      } else if (numPattern) {
        const parsedVal = parseInt(numPattern[0], 10);
        if (parsedVal <= rosterCount) {
          fedCount = parsedVal;
        }
      }
    }
    
    window.SESSION.fedCount = fedCount;
    render();

    // 🔌 SOCKET: AURA_API.logMeal
    const result = await callAPI(AURA_API.logMeal, { centreId: CW().centre || 'AWC_04', fedCount: window.SESSION.fedCount, totalPresent: window.SESSION.totalPresent || rosterCount });
    if(result?.success) {
      console.log('[Meal logged]');
      alert(lang === 'hi' 
        ? `भोजन ब्यौरा दर्ज हो गया: ${fedCount} बच्चे खिलाए ✓` 
        : `Meal logged successfully: ${fedCount} children fed ✓`);
    }
  }, lang);
}

async function openHealthScreen(childId){
  // Start by showing the default static view immediately
  window._activeHealthChild = CW().critical;
  go('health');

  if(!childId) return; // no DB child → stay with static mock

  try {
    const data = await AURA_API.getHealthRisk(childId);
    if(!data) return;

    // Build the updated health child object with API + ML data merged
    window._activeHealthChild = {
      childId: childId,
      name: { en: data.name || L(CW().critical.name), hi: data.nameHi || L(CW().critical.name) },
      age:  { en: data.age || '', hi: data.ageHi || '' },
      zscore: data.zscore ?? CW().critical.zscore,
      category: data.category || CW().critical.category,
      warning: data.earlyWarning
        ? { en: data.earlyWarning, hi: data.earlyWarningHi || data.earlyWarning }
        : CW().critical.warning,
      reason: data.reason || null,  // XAI reason {en, hi} from predictMalnutritionRisk
      riskScore: data.riskScore,    // probability 0-1 from LightGBM
      isHighRisk: data.isHighRisk,
      vitals: data.vitals || CW().critical.vitals
    };

    // Dynamically update the warning text and risk score if the screen is still active
    const warnEl = document.getElementById('health-warning-text');
    const scoreEl = document.getElementById('health-risk-score');

    if(warnEl) {
      const reasonText = data.reason ? L(data.reason) : L(window._activeHealthChild.warning);
      warnEl.textContent = reasonText;
    }
    if(scoreEl && data.riskScore !== undefined) {
      scoreEl.innerHTML = `<div style="font-size:9px;color:var(--amber);margin-top:4px">ML Risk Score: ${(data.riskScore * 100).toFixed(1)}%</div>`;
    }

    console.log(`[Early Warning] childId=${childId} risk=${data.riskScore?.toFixed(3)} highRisk=${data.isHighRisk} reason=${data.reason ? L(data.reason) : 'n/a'}`);
  } catch(err) {
    console.warn('[Early Warning] API fetch failed, staying with static data', err);
  }
}
async function handleAuditCommit(){
  const verifiedCount = window.SESSION.photoCount !== undefined ? window.SESSION.photoCount : window.SESSION.presentCount;
  const dynamicItems = [
    lang==='hi' ? `${window.SESSION.presentCount} बच्चे उपस्थित दर्ज` : `${window.SESSION.presentCount} children marked present`,
    lang==='hi' ? `${window.SESSION.absentCount} बच्चे अनुपस्थित दर्ज` : `${window.SESSION.absentCount} children marked absent`,
    lang==='hi' ? `${window.SESSION.fedCount} बच्चों को गर्म भोजन खिलाया` : `${window.SESSION.fedCount} children fed hot cooked meals`,
    lang==='hi' ? `फ़ोटो प्रमाण सहेजा गया (${verifiedCount} बच्चे)` : `Photo headcount verified (${verifiedCount} children)`
  ];
  // 🔌 SOCKET: AURA_API.commitAudit → PDF gen → CRDT sync → jump('shell')
  const result = await callAPI(AURA_API.commitAudit, {
    centreId: CW().centre || 'AWC_04',
    approvedItems: dynamicItems,
    presentCount: window.SESSION.presentCount,
    absentCount: window.SESSION.absentCount,
    fedCount: window.SESSION.fedCount
  });
  if(result?.success){
    updateSyncPill();
    // Trigger background sync via service worker
    if('serviceWorker' in navigator){
      navigator.serviceWorker.ready.then(sw => sw.sync?.register('aura-poshan-sync').catch(()=>{}));
    }
    jump('shell');
  }
}

async function updatePDFList() {
  const container = document.getElementById('pdf-list');
  if (!container) return;
  try {
    const list = await AURA_API.listPDFs();
    if (!list || list.length === 0) {
      container.innerHTML = `<span style="font-size:11px;color:var(--muted)">${lang==='hi'?'कोई पीडीएफ उपलब्ध नहीं है।':'No PDFs generated yet.'}</span>`;
      return;
    }
    container.innerHTML = list.map(pdf => {
      const sizeKB = Math.round(pdf.sizeBytes / 1024 * 100) / 100;
      const cleanName = pdf.filename.replace('.pdf', '').replace(/_/g, ' ');
      return `<div style="display:flex;align-items:center;justify-content:space-between;background:#fff;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:12px;margin-bottom:4px">
        <span style="font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px">📄 ${cleanName}</span>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:10px;color:var(--muted)">(${sizeKB} KB)</span>
          <a href="${pdf.url}" download style="background:var(--forest);color:#fff;text-decoration:none;padding:4px 8px;border-radius:6px;font-size:10px;font-weight:700">${lang==='hi'?'खोलें':'Open'}</a>
        </div>
      </div>`;
    }).join('');
  } catch (err) {
    container.innerHTML = `<span style="font-size:11px;color:var(--red)">${lang==='hi'?'लोड करने में त्रुटि':'Error loading list'}</span>`;
  }
}

  const monthSelect = document.getElementById('reg-month');
  const yearSelect = document.getElementById('reg-year');
  const btn = document.getElementById('btn-pdf-gen');
  if (!select || !btn) return;
  
  const registerType = select.value;
  const month = monthSelect ? parseInt(monthSelect.value) : (new Date().getMonth() + 1);
  const year = yearSelect ? parseInt(yearSelect.value) : new Date().getFullYear();
  const originalText = btn.textContent;
  
  btn.disabled = true;
  btn.style.opacity = '0.6';
  btn.textContent = lang === 'hi' ? 'तैयार हो रहा है...' : 'Generating...';
  
  try {
    const res = await callAPI(AURA_API.generatePDF, { registerType, month, year });
    if (res && res.success) {
      await updatePDFList();
    } else {
      alert(lang === 'hi' ? 'त्रुटि: ऑफ़लाइन या सर्वर डाउन है' : 'Error: Offline or server down');
    }
  } catch (err) {
    console.error(err);
  } finally {
    btn.disabled = false;
    btn.style.opacity = '1';
    btn.textContent = originalText;
  }
}

let deferredInstallPrompt = null;

function updateSyncPill(){
  const q = AURA_DB.get('syncQueue') || [];
  const pending = q.filter(x=>x.status==='pending').length;
  const pill = document.getElementById('sync-pill');
  if(!pill) return;
  if(!navigator.onLine){ pill.textContent='⬡ offline'; pill.className='offline'; }
  else if(pending>0){ pill.textContent=`⟳ ${pending} queued`; pill.className='queued'; }
  else { pill.textContent='● synced'; pill.className='synced'; }
}

function installPWA(){
  if(deferredInstallPrompt){ deferredInstallPrompt.prompt(); deferredInstallPrompt=null; }
}
function updateSW(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistration().then(reg=>{
      reg?.waiting?.postMessage({type:'SKIP_WAITING'});
      window.location.reload();
    });
  }
}

// Online / offline
window.addEventListener('online', ()=>{
  document.getElementById('net-banner').style.display='none';
  updateSyncPill();
  // trigger background sync
  if('serviceWorker' in navigator){
    navigator.serviceWorker.ready.then(sw => sw.sync?.register('aura-poshan-sync').catch(()=>{}));
  }
});
window.addEventListener('offline', ()=>{
  document.getElementById('net-banner').style.display='block';
  updateSyncPill();
});

// Install prompt
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredInstallPrompt = e;
  const btn = document.getElementById('install-btn');
  if (btn) btn.style.display = 'block';
});
window.addEventListener('appinstalled', ()=>{
  const btn = document.getElementById('install-btn');
  if (btn) btn.style.display = 'none';
  deferredInstallPrompt = null;
});

// SW messages
if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('message', async e=>{
    if(e.data?.type==='SYNC_COMPLETE') updateSyncPill();
    if(e.data?.type==='NAV') jump(e.data.screen);
    if(e.data?.type==='controllerchange') document.getElementById('update-banner').style.display='block';
    if(e.data?.type==='RUN_SYNC'){
      // SW asked us to flush the offline queue
      const result = await AURA_API.syncNow();
      navigator.serviceWorker.controller?.postMessage({ type:'SYNC_RESULT', ...result });
      updateSyncPill();
    }
  });
}

// Service worker registration
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('/sw.js').then(reg=>{
      console.log('[SW] Registered, scope:', reg.scope);
      reg.addEventListener('updatefound', ()=>{
        const nw = reg.installing;
        nw?.addEventListener('statechange', ()=>{
          if(nw.state==='installed' && navigator.serviceWorker.controller){
            document.getElementById('update-banner').style.display='block';
          }
        });
      });
    }).catch(err => console.warn('[SW] Registration failed:', err));
  });
}

// Automated testing hooks for YOLOv8 headcount verification
if (new URLSearchParams(location.search).has('test_yolo')) {
  window.addEventListener('load', async () => {
    console.log('[Test YOLO] Test mode active. Navigating to att screen...');
    jump('att');
    try {
      console.log('[Test YOLO] Fetching test image /test_classroom.png...');
      const response = await fetch('/test_classroom.png');
      const blob = await response.blob();
      const file = new File([blob], 'test_classroom.png', { type: 'image/png' });
      
      console.log('[Test YOLO] Initializing file input...');
      let input = document.getElementById('attendance-photo-input');
      if (!input) {
        await handleAttendanceCameraCapture();
        input = document.getElementById('attendance-photo-input');
      }
      
      const dataTransfer = new DataTransfer();
      dataTransfer.items.add(file);
      input.files = dataTransfer.files;
      
      console.log('[Test YOLO] Triggering YOLOv8 change handler...');
      input.dispatchEvent(new Event('change', { bubbles: true }));
    } catch (err) {
      console.error('[Test YOLO] Failure running test yolo auto-load:', err);
    }
  });
}

// Automated testing hooks for Whisper Tiny ASR verification
if (new URLSearchParams(location.search).has('test_whisper')) {
  window.addEventListener('load', async () => {
    console.log('[Test Whisper] Test mode active. Starting Whisper initialization...');
    try {
      const { initWhisper } = await import('./ml_pipeline/whisper_engine.js');
      await initWhisper((progress) => {
        console.log(`[Test Whisper] Load progress: ${Math.round(progress)}%`);
      });
      console.log('[Test Whisper] Whisper model initialized successfully ✓');
      alert('Whisper model loaded successfully ✓');
    } catch (err) {
      console.error('[Test Whisper] Failed to load Whisper model:', err);
    }
  });
}

// Init
AURA_API.getChildren(WORKERS[0].centre).then(list => {
  window.CHILDREN_ROSTER = list;
  if (!window.SESSION.presentIds || window.SESSION.presentIds.length === 0) {
    window.SESSION.presentIds = list.map(c => c.id);
    window.SESSION.absentIds = [];
    window.SESSION.presentCount = list.length;
    window.SESSION.absentCount = 0;
    window.SESSION.totalPresent = list.length;
    window.SESSION.fedCount = Math.round(list.length * 0.75);
  }
  render();
}).catch(err => {
  console.warn('[Startup] API fetch failed, fallback to mock children:', err);
  window.CHILDREN_ROSTER = MOCK.children;
  render();
});
updateSyncPill();
if(!navigator.onLine) document.getElementById('net-banner').style.display='block';
</script>
</body>
</html>
