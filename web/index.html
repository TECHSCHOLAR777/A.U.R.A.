<style>

svg{width:20px;height:20px;flex-shrink:0;display:block}

<body>

<div id="net-banner">You are offline: data is saved locally and will sync when connected</div>
<div id="update-banner" onclick="updateSW()">New version available: tap to update</div>

<div class="top">
  <h1>A.U.R.A.</h1>
  <p>Anganwadi Unified Resource Assistant · PWA</p>
  <div class="toprow">
    <div class="langtoggle">
      <button id="lang-hi" class="on" onclick="setLang('hi')">हिंदी</button>
      <button id="lang-en" onclick="setLang('en')">English</button>
    </div>
    <span id="sync-pill" class="offline">⬡ offline</span>
    <button id="install-btn" onclick="installPWA()">Install App</button>
  </div>
</div>

<div class="phone" id="phone">
  <div id="app"></div>
  <div class="loading-overlay" id="loader"><div class="spinner"></div></div>
</div>

<p class="hint" id="hint"></p>

<script src="aura-api.js"></script>
<script>
/* SECTIONS 1-3 (AURA_API, AURA_DB, MOCK) now live in aura-api.js,
   loaded as a separate script before this one. Edit that file to wire the backend. */

/* ============================================================
   SECTION 4 — APP STATE
   ============================================================ */
let lang = 'hi';
const BUILD = 'build 8';
let stack = ['vl1'];
let currentWorker = null;   // the logged-in worker (drives the whole dashboard)
let pendingWorker = null;   // worker matched at login, awaiting confirmation
let liveText = '';          // live speech transcript
let heardFinal = '';        // final recognized text
let recog = null;           // SpeechRecognition instance
let recogState = 'idle';    // idle | listening | matched | nomatch | error | unsupported

// Resolve a { en, hi } object by current language
function L(obj){ if(obj == null) return ''; if(typeof obj === 'string') return obj; return lang === 'hi' ? (obj.hi ?? obj.en) : (obj.en ?? obj.hi); }
// Current worker (never null once logged in; default to first for safety)
function CW(){ return currentWorker || WORKERS[0]; }

// Match what the worker said against the WORKERS dataset
function matchWorker(text){
  const t = (text || '').toLowerCase();
  return WORKERS.find(w => w.match.some(k => t.includes(k.toLowerCase()))) || null;
}

// Real browser speech recognition (Web Speech API). No ML backend needed.
function startRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  liveText = ''; heardFinal = ''; pendingWorker = null;
  if(!SR){ recogState = 'unsupported'; go('vlpick'); return; }   // not supported -> tap to pick
  recog = new SR();
  recog.lang = (lang === 'hi') ? 'hi-IN' : 'en-IN';
  recog.interimResults = true;
  recog.maxAlternatives = 3;
  recog.continuous = false;
  recogState = 'listening';

  let settled = false;
  const safety = setTimeout(() => finish(matchWorker(heardFinal || liveText)), 8000);
  function finish(worker){
    if(settled) return; settled = true;
    clearTimeout(safety);
    stopRecognition();
    if(worker){ pendingWorker = worker; recogState = 'matched'; updateLiveTranscript(); setTimeout(() => go('vl4'), 500); }
    else { go('vlpick'); }   // heard something but no name match -> tap to pick (never stuck)
  }

  recog.onresult = (e) => {
    let interim = '';
    for(let i = e.resultIndex; i < e.results.length; i++){
      const tr = e.results[i][0].transcript;
      if(e.results[i].isFinal) heardFinal += tr + ' '; else interim += tr;
    }
    liveText = (heardFinal + interim).trim();
    updateLiveTranscript();
    const w = matchWorker(liveText);            // match on everything heard, interim included
    if(w) finish(w);
    else if(heardFinal.trim()) finish(null);    // final result with no match -> picker
  };
  recog.onerror = () => finish(matchWorker(heardFinal || liveText));
  recog.onend   = () => { if(!settled) finish(matchWorker(heardFinal || liveText)); };
  try { recog.start(); } catch(err){ recogState = 'unsupported'; go('vlpick'); }
}
function stopRecognition(){ try { recog && recog.stop(); } catch(e){} }

// Update the listening screen's live text + status without re-rendering (keeps mic alive)
function updateLiveTranscript(){
  const el = document.getElementById('live-text'); if(el) el.textContent = liveText || '…';
  const st = document.getElementById('live-status');
  if(st){
    const map = {
      listening: { en:'Listening…', hi:'सुन रहे हैं…' },
      matched:   { en:'Got it ✓', hi:'मिल गया ✓' },
      nomatch:   { en:'Did not catch a name. Say again, or tap your name below.', hi:'नाम समझ नहीं आया। फिर बोलो, या नीचे अपना नाम चुनो।' },
      error:     { en:'Microphone blocked. Tap your name below instead.', hi:'माइक बंद है। नीचे अपना नाम चुनो।' }
    };
    st.textContent = L(map[recogState] || map.listening);
    st.style.color = (recogState === 'matched') ? 'var(--green)' : (recogState === 'listening' ? 'var(--forest)' : 'var(--red)');
  }
  const ring = document.getElementById('live-ring');
  if(ring) ring.classList.toggle('listening', recogState === 'listening');
}

// Tap-to-pick fallback (also used when speech is unsupported)
function pickWorker(id){ pendingWorker = WORKERS.find(w => w.id === id) || WORKERS[0]; go('vl4'); }
function confirmWorker(){ currentWorker = pendingWorker || WORKERS[0]; jump('vl5'); }

// Type a name directly: match a seeded worker, else log in under the typed name
function typedLogin(){
  const el = document.getElementById('name-input');
  const val = (el && el.value || '').trim();
  if(!val) return;
  const w = matchWorker(val);
  if(w){ pendingWorker = w; }
  else {
    const base = WORKERS[0];   // representative centre data under the typed name
    pendingWorker = { ...base, id:'AWW_TYPED', custom:true,
      av: val.charAt(0).toUpperCase(), name: { en: val, hi: val } };
  }
  stopRecognition();
  go('vl4');
}

function go(id){ stack.push(id); render(); }

function setLang(l){
  lang=l;
  document.getElementById('lang-hi').classList.toggle('on',l==='hi');
  document.getElementById('lang-en').classList.toggle('on',l==='en');
  document.documentElement.lang = l==='hi'?'hi':'en';
  render();
}
function showLoader(){ document.getElementById('loader').classList.add('show'); }
function hideLoader(){ document.getElementById('loader').classList.remove('show'); }
async function callAPI(fn, ...args){
  showLoader();
  try { const r = await fn(...args); hideLoader(); return r; }
  catch(e){ hideLoader(); console.error('[API]', e); return null; }
}

/* ============================================================
   SECTION 9 — API-WIRED EVENT HANDLERS
   These are the "sockets" — each calls an AURA_API function.
   ============================================================ */
function handleVoiceLogin(){
  // Real voice login: render the listening screen, then start the mic (within the click gesture)
  go('vl2');
  startRecognition();
}
function retryVoice(){ go('vl2'); startRecognition(); }
async function handleVoiceSARR(){
  // 🔌 SOCKET: record audio → transcribeVoice → runSARR → update registers
  const sarr = await callAPI(AURA_API.runSARR, { transcript: T[lang].voiceQ, centreId: 'AWC_04', children: MOCK.children });
  if(sarr) console.log('[SARR result]', sarr.registers);
  render(); // re-render with updated state
}
async function handleSubmitAttendance(){
  // 🔌 SOCKET: AURA_API.submitAttendance → go('audit') or shell
  const result = await callAPI(AURA_API.submitAttendance, {
    centreId: 'AWC_04', present: [], absent: ['CLD_004'], photoCount: 24
  });
  if(result?.success){ updateSyncPill(); go('audit'); }
}
async function handleLogMeal(){
  // 🔌 SOCKET: AURA_API.logMeal
  const result = await callAPI(AURA_API.logMeal, { centreId: 'AWC_04', fedCount: 18, totalPresent: 24 });
  if(result?.success) console.log('[Meal logged]');
}
async function handleHealthAction(action){
  // 🔌 SOCKET: 'weigh' → open measurement entry | 'refer' → create referral
  console.log(`[Health action: ${action}] — wire to your referral / measurement screen`);
  alert(lang==='hi'
    ? (action==='weigh'?'वज़न नापने की स्क्रीन: जल्द आएगी':'अस्पताल रेफरल बन गया ✓')
    : (action==='weigh'?'Weight entry screen: coming soon':'Hospital referral created ✓'));
}
async function handleAuditCommit(){
  // 🔌 SOCKET: AURA_API.commitAudit → PDF gen → CRDT sync → jump('shell')
  const result = await callAPI(AURA_API.commitAudit, {
    centreId: 'AWC_04',
    approvedItems: T[lang].auditItems.map(i=>i[0]),
  });
  if(result?.success){
    updateSyncPill();
    // Trigger background sync via service worker
    if('serviceWorker' in navigator){
      navigator.serviceWorker.ready.then(sw => sw.sync?.register('aura-poshan-sync').catch(()=>{}));
    }
    jump('shell');
  }
}

/* ============================================================
   SECTION 10 — RENDER
   ============================================================ */
function render(){
  const id = stack[stack.length-1];
  document.getElementById('app').innerHTML = (screens[id] || screens.shell)();
  document.getElementById('phone').className = 'phone' + (lang==='hi'?' hindi':'');
  document.getElementById('hint').textContent = lang==='hi'
    ? 'बटन दबाएँ, नेविगेट करें। ऊपर से भाषा बदलें।'
    : 'Tap buttons to navigate. Flow: splash → voice → language → profile → home → attendance → review.';
  // reflect in URL without reload
  try { history.replaceState(null,'','/?screen='+id); } catch{}
}

/* ============================================================
   SECTION 11 — PWA BOOTSTRAP
   ============================================================ */
let deferredInstallPrompt = null;

function updateSyncPill(){
  const q = AURA_DB.get('syncQueue') || [];
  const pending = q.filter(x=>x.status==='pending').length;
  const pill = document.getElementById('sync-pill');
  if(!pill) return;
  if(!navigator.onLine){ pill.textContent='⬡ offline'; pill.className='offline'; }
  else if(pending>0){ pill.textContent=`⟳ ${pending} queued`; pill.className='queued'; }
  else { pill.textContent='● synced'; pill.className='synced'; }
}

function installPWA(){
  if(deferredInstallPrompt){ deferredInstallPrompt.prompt(); deferredInstallPrompt=null; }
}
function updateSW(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistration().then(reg=>{
      reg?.waiting?.postMessage({type:'SKIP_WAITING'});
      window.location.reload();
    });
  }
}

// Online / offline
window.addEventListener('online', ()=>{
  document.getElementById('net-banner').style.display='none';
  updateSyncPill();
  // trigger background sync
  if('serviceWorker' in navigator){
    navigator.serviceWorker.ready.then(sw => sw.sync?.register('aura-poshan-sync').catch(()=>{}));
  }
});
window.addEventListener('offline', ()=>{
  document.getElementById('net-banner').style.display='block';
  updateSyncPill();
});

// Install prompt
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredInstallPrompt = e;
  document.getElementById('install-btn').style.display = 'block';
});
window.addEventListener('appinstalled', ()=>{
  document.getElementById('install-btn').style.display = 'none';
  deferredInstallPrompt = null;
});

// SW messages
if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('message', async e=>{
    if(e.data?.type==='SYNC_COMPLETE') updateSyncPill();
    if(e.data?.type==='NAV') jump(e.data.screen);
    if(e.data?.type==='controllerchange') document.getElementById('update-banner').style.display='block';
    if(e.data?.type==='RUN_SYNC'){
      // SW asked us to flush the offline queue
      const result = await AURA_API.syncNow();
      navigator.serviceWorker.controller?.postMessage({ type:'SYNC_RESULT', ...result });
      updateSyncPill();
    }
  });
}

// Service worker registration
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('/sw.js').then(reg=>{
      console.log('[SW] Registered, scope:', reg.scope);
      reg.addEventListener('updatefound', ()=>{
        const nw = reg.installing;
        nw?.addEventListener('statechange', ()=>{
          if(nw.state==='installed' && navigator.serviceWorker.controller){
            document.getElementById('update-banner').style.display='block';
          }
        });
      });
    }).catch(err => console.warn('[SW] Registration failed:', err));
  });
}

// Handle deep-link from URL ?screen=xxx
const urlScreen = new URLSearchParams(location.search).get('screen');
if(urlScreen && screens[urlScreen]) stack = [urlScreen];

// Init
render();
updateSyncPill();
if(!navigator.onLine) document.getElementById('net-banner').style.display='block';
</script>
