<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1A7F74">
<meta name="description" content="A.U.R.A. Anganwadi Unified Resource Assistant. Offline-first field tool for Anganwadi workers.">
<title>A.U.R.A. Anganwadi Unified Resource Assistant</title>
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "onnxruntime-web": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/esm/ort.all.min.js"
  }
}
</script>
<style>
  :root{
    --color-primary:#1A7F74; --color-primary-light:#E8F5F3; --color-primary-dark:#115C52;
    --color-success:#1B7E4A; --color-success-light:#E9F5EE; --color-success-text:#14562F;
    --color-warning:#C07A00; --color-warning-light:#FFF3D6; --color-warning-text:#7A4E00;
    --color-danger:#C0392B; --color-danger-light:#FDECEA; --color-danger-text:#8B1A12;
    --color-info:#1A5B99; --color-info-light:#E8F0FB;
    --color-neutral-900:#111827; --color-neutral-700:#374151; --color-neutral-500:#6B7280;
    --color-neutral-400:#9CA3AF; --color-neutral-200:#E5E7EB; --color-neutral-100:#F3F4F6;
    --color-neutral-50:#F9FAFB; --color-white:#FFFFFF; --color-surface:#FFFFFF; --color-background:#F4F6F8;
    --color-domain-cognitive:#7C3AED; --color-domain-language:#1D4ED8; --color-domain-motor:#15803D;
    --color-domain-socio:#D97706; --color-domain-creative:#BE185D;
    --font-family:'Noto Sans','Noto Sans Devanagari',system-ui,sans-serif;
    --text-display:700 26px/32px var(--font-family); --text-heading-lg:700 20px/26px var(--font-family);
    --text-heading-md:700 17px/22px var(--font-family); --text-heading-sm:600 15px/20px var(--font-family);
    --text-body-lg:500 15px/22px var(--font-family); --text-body-md:500 13px/20px var(--font-family);
    --text-body-sm:500 12px/18px var(--font-family); --text-label:600 13px/18px var(--font-family);
    --text-meta:500 11px/16px var(--font-family); --text-chip:600 11px/14px var(--font-family);
    --text-button-lg:700 15px/20px var(--font-family); --text-button-md:700 13px/18px var(--font-family);
    --text-button-sm:600 12px/16px var(--font-family);
    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px;
    --space-8:32px; --space-12:48px; --space-14:56px;
    --radius-sm:6px; --radius-md:10px; --radius-lg:16px; --radius-xl:24px; --radius-full:9999px;
    --shadow-sm:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
    --shadow-md:0 4px 12px rgba(0,0,0,.10),0 2px 4px rgba(0,0,0,.06);
    --shadow-lg:0 8px 24px rgba(0,0,0,.12),0 4px 8px rgba(0,0,0,.08);
    --duration-fast:120ms; --duration-normal:200ms; --ease-out:cubic-bezier(0,0,.2,1);
    --forest:var(--color-primary-dark); --forest-d:#11261C; --green:var(--color-success); --green-d:#14562F; --red:var(--color-danger);
    --amber:var(--color-warning); --orange:#D67424; --purple:#6B5296; --navy:var(--color-info);
    --ink:var(--color-neutral-900); --muted:var(--color-neutral-500); --line:var(--color-neutral-200); --card:var(--color-neutral-100);
    --bg:var(--color-white); --rl:var(--color-danger-light); --al:var(--color-warning-light); --gl:var(--color-success-light); --pl:#F0EDF7;
    --saffron:var(--color-warning); --indiagreen:var(--color-success);
    --r-card:var(--radius-lg); --r-tile:var(--radius-md); --tap:44px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--font-family);background:#0d0d0d;color:var(--ink);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 12px 60px}
  .hindi *{font-family:'Noto Sans Devanagari','Inter',sans-serif}
  button{font-family:inherit}
  :focus-visible{outline:2px solid var(--color-primary);outline-offset:2px;border-radius:var(--radius-sm)}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

  .top{width:100%;max-width:430px;color:#eee;margin-bottom:18px}
  .top h1{font-size:20px;font-weight:800;letter-spacing:.5px}
  .top p{font-size:12px;color:#999;margin-top:3px}
  .langtoggle{display:inline-flex;margin-top:12px;background:#1c1c1c;border-radius:10px;padding:3px;gap:2px}
  .langtoggle button{background:none;border:none;color:#888;font-size:13px;font-weight:600;padding:9px 18px;border-radius:8px;cursor:pointer;min-height:var(--tap)}
  .langtoggle button.on{background:var(--green);color:#fff}

  .phone{width:390px;max-width:96vw;height:800px;background:var(--bg);border-radius:38px;overflow:hidden;position:relative;
    box-shadow:0 0 0 11px #1a1a1a, 0 0 0 13px #2a2a2a, 0 30px 70px rgba(0,0,0,.6)}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg);overflow:hidden}
  .screen.active{display:flex}
  .scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  .scroll::-webkit-scrollbar{width:0}

  svg{width:20px;height:20px;flex-shrink:0;display:block}
  .nav .tab svg{width:22px;height:22px}
  .nav .fab svg{width:26px;height:26px}
  .dark .logo svg{width:40px;height:40px}
  .globewrap svg{width:30px;height:30px}

  .statusbar{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:13px;font-weight:600;flex-shrink:0}
  .statusbar .r{color:var(--muted);font-size:11px;font-weight:500;display:flex;gap:6px;align-items:center}
  .govbar{height:26px;background:var(--forest-d);color:#cfe3d8;font-size:9px;font-weight:600;letter-spacing:.3px;
    display:flex;align-items:center;justify-content:center;gap:7px;flex-shrink:0;text-align:center;padding:0 10px}
  .govbar .tri{width:14px;height:10px;border-radius:2px;overflow:hidden;display:inline-flex;flex-direction:column;flex-shrink:0}
  .govbar .tri i{flex:1}
  .header{height:56px;display:flex;align-items:center;padding:0 18px;gap:10px;flex-shrink:0;border-bottom:1px solid var(--line)}
  .avatar{width:36px;height:36px;border-radius:50%;background:var(--forest);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;position:relative;flex-shrink:0}
  .avatar::after{content:'';position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:var(--indiagreen);border:2px solid #fff}
  .brand{font-size:18px;font-weight:800;color:var(--forest);letter-spacing:.5px}
  .brand small{display:block;font-size:8px;font-weight:600;color:var(--muted);letter-spacing:.3px}
  .header .right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .pill-lang{border:1px solid var(--line);border-radius:12px;padding:7px 11px;font-size:11px;font-weight:700;cursor:pointer;min-height:38px;background:#fff;color:var(--ink)}
  .bellbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);position:relative}
  .bellbtn .dotn{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--red)}
  .body{padding:0 var(--space-4) calc(72px + var(--space-4))}

  .greet{font-size:16px;color:var(--muted);margin-top:12px}
  .greet small{display:block;font-size:13px;margin-top:2px}
  .kw{margin:18px 0 4px;font-size:23px;font-weight:800;line-height:1.3}
  .kw .hl{color:#fff;padding:1px 10px;border-radius:7px;display:inline-block}
  .sub{font-size:12.5px;color:var(--muted);margin:6px 0 14px;line-height:1.55}

  .nowcard{background:var(--forest);border-radius:var(--r-card);padding:18px;color:#fff;position:relative;overflow:hidden;margin-top:6px}
  .nowcard::after{content:'';position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.04)}
  .nowcard .nclock{font-size:11px;color:#bcd8cb;display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .nowcard .nclock svg{width:14px;height:14px;color:#bcd8cb}
  .nowcard .nlabel{font-size:11px;color:#9fc3b1;font-weight:600;letter-spacing:.4px}
  .nowcard h2{font-size:25px;font-weight:800;margin-top:2px}
  .nowcard .ntask{font-size:14px;color:#d7ece1;margin-top:4px}
  .nowbtn{margin-top:16px;background:var(--green);color:#fff;border:none;border-radius:11px;width:100%;padding:14px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:space-between;min-height:var(--tap);position:relative;z-index:1}
  .nowbtn span.arrow{font-size:18px}

  .alert{display:flex;align-items:center;gap:12px;background:var(--rl);border:1px solid var(--red);border-left:4px solid var(--red);border-radius:11px;padding:14px;margin-top:16px;cursor:pointer;min-height:var(--tap)}
  .alert .ai{width:22px;height:22px;flex-shrink:0;color:var(--red)}
  .alert .ai svg{width:22px;height:22px}
  .alert .t{font-size:13px;font-weight:700;color:var(--red);flex:1;line-height:1.35}
  .alert .chev{color:var(--red);font-weight:700;flex-shrink:0;font-size:18px}

  .sectionlabel{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.5px;margin:22px 0 10px;text-transform:uppercase}
  .slot{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:11px;padding:12px;margin-bottom:9px;background:var(--card);cursor:pointer;transition:transform .15s;min-height:var(--tap)}
  .slot:hover{transform:translateX(2px)}
  .slot.now{background:#fff;border:2px solid var(--green);border-left:4px solid var(--green)}
  .slot .dot{width:32px;height:32px;border-radius:50%;background:#e3e3e3;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff}
  .slot .dot svg{width:16px;height:16px}
  .slot.now .dot{background:var(--green)}
  .slot .meta{flex:1}
  .slot .meta .a{font-size:13.5px;font-weight:700;color:var(--muted)}
  .slot.now .meta .a{color:var(--ink)}
  .slot .meta .b{font-size:10.5px;color:var(--muted);margin-top:1px}
  .slot .nowtag{background:var(--green);color:#fff;font-size:9px;font-weight:700;padding:5px 10px;border-radius:11px}
  .slot .stt{margin-left:auto;font-size:9px;font-weight:700;color:var(--muted)}
  .slot.done{background:#fff;border-color:var(--line);border-left-color:var(--green)}
  .slot.done .dot{background:var(--green)}
  .slot.done .meta .a{color:var(--ink)}
  .slot.done .stt{background:var(--gl);color:var(--green);border-radius:11px;padding:5px 9px}
  .slot.locked{opacity:.62}

  .blockh{display:flex;align-items:center;gap:8px;padding:9px 14px;border-left:6px solid;margin:0 -20px}
  .blockh .num{font-size:12px;font-weight:800}
  .blockh .ti{font-size:13px;font-weight:700}
  .blockh .su{margin-left:auto;font-size:9px;font-weight:500}
  .crow{display:flex;gap:12px;border:1px solid var(--line);border-left:4px solid;border-radius:11px;padding:12px;margin:9px 0;background:#fff;cursor:pointer;align-items:flex-start;min-height:var(--tap)}
  .crow .ic{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;margin-top:2px}
  .crow .info{flex:1}
  .crow .info .nm{font-size:14px;font-weight:700}
  .crow .info .ag{font-size:9.5px;color:var(--muted);margin:2px 0}
  .crow .info .ds{font-size:10.5px;line-height:1.45}
  .crow .tag{font-size:8px;font-weight:600;padding:3px 8px;border-radius:9px;height:fit-content;white-space:nowrap}

  .transcript{background:#fff;border:2px solid var(--green);border-left:4px solid var(--green);border-radius:13px;padding:14px;margin-bottom:16px}
  .transcript .q{font-size:14px;line-height:1.5}
  .transcript .h{font-size:10px;font-weight:600;color:var(--green);margin-top:10px;display:flex;align-items:center;gap:6px}
  .bar{height:5px;background:#e6e6e6;border-radius:3px;margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--green)}
  .reg{display:flex;align-items:center;border-radius:11px;padding:11px 12px;margin-bottom:9px;border-left:4px solid;min-height:46px}
  .reg .l{font-size:9px;font-weight:600}
  .reg .v{font-size:13px;font-weight:700;color:var(--ink)}
  .reg .st{margin-left:auto;font-size:8px;font-weight:700;color:#fff;padding:5px 11px;border-radius:10px}
  .tier{display:flex;align-items:center;border-radius:11px;padding:11px 12px;margin-bottom:9px;border:1px solid var(--line);border-left:4px solid var(--line)}
  .tier.on{border-width:1px}
  .tier .tl{font-size:12px;font-weight:700}
  .tier .td{font-size:9.5px;color:var(--muted)}
  .tier .ck{margin-left:auto;width:22px;height:22px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center}
  .tier .ck svg{width:12px;height:12px}

  .hero{border-radius:14px;padding:16px;color:#fff;position:relative;overflow:hidden}
  .hero h2{font-size:22px;font-weight:800}
  .hero p{font-size:12px;margin-top:4px;opacity:.92}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .vital{border:1px solid var(--line);border-radius:12px;padding:12px}
  .vital .l{font-size:9.5px;color:var(--muted)}
  .vital .v{font-size:16px;font-weight:800;margin-top:3px}
  .vital .d{font-size:9.5px;margin-top:3px}

  .btn{border:none;border-radius:var(--radius-md);padding:12px 14px;font:var(--text-button-md);cursor:pointer;width:100%;min-height:var(--tap);display:flex;align-items:center;justify-content:center;gap:8px;transition:transform var(--duration-fast) var(--ease-out),background var(--duration-fast) var(--ease-out)}
  .btn:active{transform:scale(.99)}
  .btn:disabled{background:var(--color-neutral-100)!important;color:var(--color-neutral-400)!important;border-color:var(--color-neutral-200)!important;cursor:not-allowed;opacity:1!important}
  .btn svg{width:18px;height:18px}
  .btn.primary{background:var(--forest);color:#fff}
  .btn.green{background:var(--green);color:#fff}
  .btn.red{background:var(--red);color:#fff}
  .btn.ghost{background:#fff;border:1.5px solid var(--forest);color:var(--forest)}
  .btn.outline{background:#fff;border:1px solid var(--line);color:var(--muted)}

  .vcard{border:1px solid var(--line);border-left:4px solid;border-radius:11px;padding:12px;margin-bottom:9px}
  .vcard .mh{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .vcard .mh svg{width:18px;height:18px}
  .activity-brief{border:1px solid var(--line);border-left:4px solid var(--purple);border-radius:var(--radius-lg);padding:14px;background:linear-gradient(180deg,#fff,#fdfcff);box-shadow:var(--shadow-sm);position:relative;margin-bottom:12px}
  .activity-brief__top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .activity-brief__label{font:var(--text-meta);font-weight:800;color:var(--purple);text-transform:uppercase;letter-spacing:.45px;margin-bottom:5px}
  .activity-brief__title{font:var(--text-heading-md);color:var(--ink);padding-right:4px}
  .activity-brief__source{font:var(--text-meta);font-weight:800;color:#fff;background:var(--purple);border-radius:var(--radius-full);padding:5px 9px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
  .activity-brief__chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .activity-chip{display:inline-flex;align-items:center;gap:5px;border-radius:var(--radius-full);background:var(--pl);color:var(--purple);border:1px solid #dfd5ef;padding:5px 9px;font:var(--text-chip)}
  .activity-chip__icon{width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;color:var(--purple)}
  .activity-chip__icon svg{width:14px;height:14px}
  .activity-focus-strip{display:flex;gap:9px;align-items:flex-start;border:1px solid #d7ebdf;background:linear-gradient(180deg,#f4fbf7,#fff);border-radius:var(--radius-md);padding:10px 11px;margin-bottom:10px;color:var(--green);font:var(--text-body-sm)}
  .activity-focus-strip svg{width:18px;height:18px;flex-shrink:0;margin-top:1px}
  .activity-focus-strip strong{display:block;font:var(--text-meta);text-transform:uppercase;letter-spacing:.35px;color:var(--green)}
  .activity-focus{margin-top:12px;border-radius:var(--radius-md);background:var(--color-neutral-50);border:1px solid var(--line);padding:10px 11px;font:var(--text-body-sm);color:var(--color-neutral-700)}
  .activity-focus strong{display:block;color:var(--forest);font:var(--text-meta);text-transform:uppercase;letter-spacing:.35px;margin-bottom:3px}
  .activity-steps{margin-top:12px;display:flex;flex-direction:column;gap:8px}
  .activity-step{display:grid;grid-template-columns:28px 1fr;gap:9px;align-items:start;border:1px solid var(--line);border-radius:var(--radius-md);background:#fff;padding:9px}
  .activity-step__num{width:28px;height:28px;border-radius:50%;background:var(--forest);color:#fff;display:flex;align-items:center;justify-content:center;font:var(--text-chip)}
  .activity-step__text{font:var(--text-body-sm);color:var(--ink)}
  .activity-panels{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}
  .activity-panel{border-radius:var(--radius-md);padding:10px 11px;border:1px solid var(--line);font:var(--text-body-sm)}
  .activity-panel strong{display:flex;align-items:center;gap:6px;font:var(--text-meta);text-transform:uppercase;letter-spacing:.35px;margin-bottom:4px}
  .activity-panel strong svg{width:15px;height:15px}
  .activity-panel--milestone{background:var(--gl);border-color:#cce9d8;color:var(--green)}
  .activity-panel--inclusion{background:var(--color-info-light);border-color:#d4e3f6;color:var(--navy)}
  .item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-left:4px solid;border-radius:10px;padding:11px 12px;margin-bottom:8px;min-height:44px}
  .item .b{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:#fff;flex-shrink:0}
  .item .x{font-size:10.5px;line-height:1.4}
  .camline{background:#161616;border-radius:11px;padding:13px;margin-top:12px;display:flex;gap:10px;align-items:center;cursor:pointer;min-height:var(--tap)}
  .camline .ci{width:20px;height:20px;flex-shrink:0;color:#8fe6c0}

  .nav{height:72px;background:#fff;border-top:1px solid var(--line);display:flex;position:relative;flex-shrink:0}
  .nav .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--muted);position:relative;min-height:var(--tap)}
  .nav .tab.on{color:var(--forest)}
  .nav .tab.on::before{content:'';position:absolute;top:0;width:34px;height:3px;background:var(--forest);border-radius:2px}
  .nav .tab .lab{font-size:9.5px;font-weight:600}
  .nav .fab{position:absolute;left:50%;top:-22px;transform:translateX(-50%);width:58px;height:58px;border-radius:50%;background:var(--forest);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(27,58,45,.45);cursor:pointer;border:4px solid #fff}
  .nav .fab svg{color:#fff}
  .navspacer{flex:1.4}

  .screen.dark{position:absolute;inset:0}
  .dark{background:var(--forest);color:#fff;justify-content:center;align-items:center;text-align:center;padding:44px 32px;overflow:hidden}
  .dark::before{content:'';position:absolute;top:-80px;left:50%;transform:translateX(-50%);width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.05),transparent 70%);pointer-events:none}
  .dark .logo{width:96px;height:96px;border-radius:50%;background:var(--forest-d);display:flex;align-items:center;justify-content:center;margin-bottom:24px;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 0 0 11px rgba(255,255,255,.04);position:relative;z-index:1}
  .dark .logo svg{color:#fff}
  .dark h1{font-size:48px;font-weight:800;letter-spacing:4px;line-height:1}
  .dark .fullform{font-size:11px;color:#9fc3b1;margin-top:12px;letter-spacing:2px;text-transform:uppercase;font-weight:600;line-height:1.6}
  .dark .rule{width:42px;height:2px;background:rgba(255,255,255,.22);border-radius:2px;margin:22px 0}

async function loadDailyState() {

}

  const saved = await AURA_DB.get('dssResults');
  dssResults = saved && typeof saved === 'object' ? saved : {};
}

async function saveDailyState(patch = {}) {
  dailyState = { ...dailyState, ...patch };
  await AURA_DB.set(DAILY_STATE_KEY, dailyState);

function workflowStep(label, done, active, blocked) {
  const bg = done ? 'var(--gl)' : active ? 'var(--pl)' : blocked ? 'var(--rl)' : 'var(--card)';
  const color = done ? 'var(--green)' : active ? 'var(--purple)' : blocked ? 'var(--red)' : 'var(--muted)';
  const mark = done ? '✓' : active ? '•' : blocked ? '!' : '○';
  return `<div style="background:${bg};color:${color};border:1px solid ${color};border-radius:10px;padding:7px 6px;font-size:8.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;"><span>${mark}</span>${label}</div>`;
}

function workflowStrip(activeStep) {
  const labels = lang === 'hi'

// Map age band to Navchetana curriculum node for activity retrieval
function deriveNodeFromBand(band) {
  const map = {
    '0-3':'SE-1','3-6':'GM-1','6-9':'FM-1','9-12':'LA-1',
    '12-18':'GM-3','18-24':'SE-3','24-36':'FM-3'
  };
  return map[band] || 'FM-3';
}

// Client-side age band derivation (mirrors server.js deriveBand)
function deriveBandClient(childProfiles) {
  if (!Array.isArray(childProfiles) || childProfiles.length === 0) return '0-3';
  const ages = childProfiles.map(p => typeof p.age_months === 'number' ? p.age_months : null).filter(a => a !== null);
  if (ages.length === 0) return '0-3';
  const avg = ages.reduce((s, a) => s + a, 0) / ages.length;
  if (avg < 3) return '0-3';
  if (avg < 6) return '3-6';
  if (avg < 9) return '6-9';
  if (avg < 12) return '9-12';
  if (avg < 18) return '12-18';
  if (avg < 24) return '18-24';
  return '24-36';
}

function buildRoomContext(childProfiles) {
  const presentCount = childProfiles.length;
  const needs = new Set();
  for (const profile of childProfiles) {
    if (Array.isArray(profile.needs)) {
      profile.needs.forEach((need) => needs.add(String(need)));
    }
  }

  const ageMix = childProfiles.length
    ? childProfiles.map((profile) => profile.age_months || 0).join(',')
    : 'none';

  return {
    present_count: presentCount,
    materials: roomMaterials,
    inclusion_flags: [...needs],
    ageMix,
    materialsKey: roomMaterials.length ? roomMaterials.join(',') : 'none',
  };
}

function getActivityCacheKey(payload) {
  const materials = Array.isArray(payload.context?.materials) ? payload.context.materials.join('|') : '';
  const needs = Array.isArray(payload.context?.inclusion_flags) ? payload.context.inclusion_flags.join('|') : '';
  const ages = Array.isArray(payload.child_profiles)
    ? payload.child_profiles.map((child) => child.age_months || 'na').join('|')
    : '';
  return `${ACTIVITY_CACHE_PREFIX}${payload.age_band_months}::${payload.node_id}::${materials}::${needs}::${ages}`;
}

function normalizeActivitySteps(activity, fallbackText) {
  const rawSteps = Array.isArray(activity && activity.step_by_step_instructions)
    ? activity.step_by_step_instructions
    : (activity && typeof activity.step_by_step_instructions === 'string'
      ? activity.step_by_step_instructions.split(/\n+/)
      : []);
  const steps = rawSteps
    .flatMap((step) => String(step || '').split(/\n+/))
    .map((step) => step.replace(/^\s*(?:\d+[\).:-]?|[-*])\s*/, '').trim())
    .filter(Boolean);
  if (steps.length) return steps.slice(0, 6);
  return [fallbackText || (lang === 'hi' ? 'गतिविधि निर्देश उपलब्ध नहीं हैं।' : 'Activity instructions are not available.')];
}

}

// Parse DSS milestone_due strings to months (e.g. "6 months" -> 6, "3 years" -> 36)
function parseMilestoneDueMonths(str) {
  if (!str) return 0;
  const lower = str.toLowerCase().trim();
  let match = lower.match(/(\d+)\s*[-\u2013]\s*(\d+)\s*months?/);
  if (match) return parseInt(match[2], 10);
  match = lower.match(/(\d+)\s*months?/);
  if (match) return parseInt(match[1], 10);
  match = lower.match(/(\d+)\s*years?/);
  if (match) return parseInt(match[1], 10) * 12;
  return 0;
}

      return `<div class="slot ${cls}" onclick="go('${s[2]}')" aria-label="${s[0]} ${state.done ? t.doneShort : state.active ? t.nowtag : t.pendShort}"><div class="dot">${state.done ? SVG.check : SVG[navic[s[2]]]}</div><div class="meta"><div class="a">${s[0]}</div><div class="b">${s[1]}</div></div>${status}</div>`;
    }).join('');
    return `
      <div class="screen active">${statusbar(nowClock())}${header()}
        <div class="scroll">
          <div class="body">
            <div class="greet">${lang==='hi' ? 'सुप्रभात' : 'Good morning'}, ${activeWorker ? activeWorker.name : (lang==='hi' ? 'कार्यकर्ता' : 'Worker')}<small>${new Date().toLocaleDateString(lang==='hi'?'hi-IN':'en-IN',{weekday:'long',day:'numeric',month:'long'})}</small></div>
            ${workflowStrip('att')}
            ${activeChildren.length === 0 ? `
              <div class="alert" style="background:var(--rl);border:1px solid var(--red);border-left:4px solid var(--red);border-radius:11px;padding:14px;margin-top:16px;cursor:pointer;" onclick="go('children_manager')">
                <span class="ai" style="color:var(--red);">${SVG.warn}</span>
                <span class="t" style="color:var(--red);font-size:12px;">${lang === 'hi' ? 'कोई बच्चा पंजीकृत नहीं है! बच्चों को पंजीकृत करने के लिए यहाँ क्लिक करें।' : 'No children registered! Click here to register children.'}</span>
                <span class="chev" style="color:var(--red);">›</span>
              </div>
            ` : ''}
            <div class="nowcard">
              <div class="nclock">${SVG.clock} ${nowLabel()}</div>
              <div class="nlabel">${t.nowLabel}</div>
              <h2>${t.nowTask}</h2>
              <div class="ntask">${t.nowSub}</div>
              <button class="nowbtn" onclick="go('att')">${t.start}<span class="arrow">→</span></button>
            </div>

            <div class="sectionlabel">${t.day}</div>
            ${slots}
          </div>
        </div>
        ${nav('home')}
      </div>
    `;
  },

  voice() {
    const t = T[lang];
    const online = (typeof navigator !== 'undefined' && navigator.onLine) && isOnline();
    const supported = ('webkitSpeechRecognition' in window) || ('SpeechRecognition' in window);
    let panel;
    if (!online) {
      panel = `<div class="vcard" style="border-left-color:var(--amber)"><div style="font-size:12px;color:var(--amber);font-weight:700">${lang==='hi'?'आवाज़ के लिए इंटरनेट चाहिए':'Voice requires internet'}</div><div style="font-size:10.5px;color:var(--muted);margin-top:4px">${lang==='hi'?'कृपया टैप / मैनुअल इनपुट का उपयोग करें।':'Please use tap / manual input.'}</div></div>`;
    } else if (!supported) {
      panel = `<div class="vcard" style="border-left-color:var(--red)"><div style="font-size:12px;color:var(--red);font-weight:700">${lang==='hi'?'इस डिवाइस पर आवाज़ समर्थित नहीं':'Voice not supported on this device'}</div><div style="font-size:10.5px;color:var(--muted);margin-top:4px">${lang==='hi'?'कृपया मैनुअल इनपुट का उपयोग करें।':'Please use manual input.'}</div></div>`;
    } else {
      panel = `
        <button class="btn green" id="voice-mic-btn" onclick="startVoiceCapture()">${SVG.voice} ${lang==='hi'?'बोलें (सामग्री / गिनती)':'Speak (materials / counts)'}</button>
        <div id="voice-status" style="font-size:10px;color:var(--muted);text-align:center;margin-top:8px">${lang==='hi'?'सिर्फ़ संख्या या सामग्री बोलें। नाम नहीं।':'Say a count or a material only. No names.'}</div>
        <div class="transcript" style="margin-top:12px;min-height:44px"><div class="q" id="voice-transcript" style="color:var(--muted)">…</div></div>`;
    }
    return `
      <div class="screen active">${statusbar(nowClock())}${header()}
        <div class="scroll">
          <div class="body" style="padding-top:6px">
            <button class="backbtn" style="background:var(--gl);color:var(--green)" onclick="back()">‹ ${lang==='hi'?'वापस':'Back'}</button>
            ${kw(t.voiceKw,'--green')}
            <div class="sub">${lang==='hi'?'केवल सामग्री और गिनती के लिए - कोई बच्चों के नाम या निजी जानकारी नहीं।':'For materials and counts only - never child names or personal data.'}</div>
            ${panel}
          </div>
        </div>
        ${nav('ece')}
      </div>
    `;
  },

  att() {
    const t = T[lang];
    const totalCount = activeChildren.length;
    const presentCount = activeChildren.filter(c => c.present).length;
    const pctVal = totalCount > 0 ? Math.round((presentCount / totalCount) * 100) : 0;

    const kids = activeChildren.map(c => {
      const borderCol = c.present ? 'var(--green)' : 'var(--red)';
      const bgCol = c.present ? 'var(--gl)' : 'var(--rl)';
      const icon = c.present ? '✓' : '✕';
      const textTag = c.present 
        ? (lang==='hi' ? ' · अनुपस्थित करने के लिए टैप करें' : ' · tap to mark absent') 
        : (lang==='hi' ? ' · उपस्थित करने के लिए टैप करें' : ' · tap to mark present');

      return `
        <div class="crow" 
             style="border-left-color:${borderCol};background:#fff;cursor:pointer;margin-bottom:8px;" 
             onclick="toggleAttendance('${c.childId}')">
          <div class="ic" style="background:${bgCol};color:${borderCol}">${icon}</div>
          <div class="info">
            <div class="nm">${c.name[lang]}</div>
            <div class="ag">${c.age[lang]}${textTag}</div>
          </div>
        </div>
      `;
    }).join('');

    const attendanceSummary = lang === 'hi'
      ? `${totalCount} में से ${presentCount} उपस्थित (${pctVal}%)`
      : `${presentCount} of ${totalCount} present (${pctVal}%)`;
    const confirmedHtml = dailyState.attendance_confirmed
      ? `<div style="background:var(--gl);border:1px solid var(--green);border-radius:10px;padding:9px 11px;margin:8px 0 12px;font-size:10.5px;font-weight:800;color:var(--green);">${lang==='hi'?'Attendance confirmed. Change marks only if needed, then confirm again.':'Attendance is confirmed. Change marks only if needed, then confirm again.'}</div>`
      : `<div style="background:var(--al);border:1px solid var(--amber);border-radius:10px;padding:9px 11px;margin:8px 0 12px;font-size:10.5px;font-weight:800;color:var(--amber);">${lang==='hi'?'All children start present. Tap only absent children, then confirm attendance.':'All children start as present. Tap only absent children, then confirm attendance.'}</div>`;

    const allPresentHero = presentCount === totalCount
      ? `<div class="hero" style="background:linear-gradient(135deg,var(--green),var(--forest));margin-top:6px">
          <h2>${lang === 'hi' ? `हाज़िरी तैयार: ${totalCount}/${totalCount}` : `Attendance ready: ${totalCount}/${totalCount}`}</h2>
          <p>${lang === 'hi' ? 'All children are currently marked present. Review the roster below before confirming.' : 'All children are currently marked present. Review the roster below before confirming.'}</p>
          <p style="font-size:10px;margin-top:6px;opacity:.85">${lang === 'hi' ? `${nowClock()} दर्ज` : `Recorded at ${nowClock()}`}</p>
         </div>`
      : `<div class="hero" style="background:var(--amber);margin-top:6px">
          <h2>${lang === 'hi' ? `${presentCount} बच्चे उपस्थित` : `${presentCount} Children Present`}</h2>
          <p>${lang === 'hi' ? 'कुछ बच्चे अनुपस्थित हैं। रजिस्टर में अपडेट करें।' : 'Some children are absent. Marked in roster below.'}</p>
         </div>`;

    return `
      <div class="screen active">${statusbar(nowClock())}${header()}
        <div class="scroll">
          <div class="body" style="padding-top:6px">
            <button class="backbtn" style="background:var(--gl);color:var(--green)" onclick="back()">
              ‹ ${lang==='hi'?'वापस':'Back'}
            </button>
            ${workflowStrip('att')}
            ${kw(t.attKw,'--green')}
            ${confirmedHtml}
            
            ${allPresentHero}
            
            <div class="camline" id="camline-btn" onclick="openHeadcountModel()" style="${Number.isFinite(Number(dailyState.photo_count)) ? (Number(dailyState.photo_count) === presentCount ? 'background:#143f2b;border:1px solid var(--green);' : 'background:#5f3514;border:1px solid var(--amber);') : ''}">
              <span class="ci">${SVG.cam}</span>
              <div>
                <div id="camline-title" style="color:#cdeede;font-size:11px;font-weight:600">${Number.isFinite(Number(dailyState.photo_count)) ? (lang === 'hi' ? `फोटो से गिना: ${dailyState.photo_count}` : `Photo count: ${dailyState.photo_count} children`) : t.camLine}</div>
                <div id="camline-subtitle" style="color:#7fae97;font-size:9px">${Number.isFinite(Number(dailyState.photo_count)) ? (Number(dailyState.photo_count) === presentCount ? (lang === 'hi' ? `रजिस्टर से मेल खाता है (${Math.round(Number(dailyState.photo_confidence || 0) * 100)}%)` : `Matches attendance (${Math.round(Number(dailyState.photo_confidence || 0) * 100)}% confidence)`) : (lang === 'hi' ? `अंतर: फोटो ${dailyState.photo_count}, रजिस्टर ${presentCount}` : `Mismatch: photo ${dailyState.photo_count}, attendance ${presentCount}`)) : (lang === 'hi' ? 'कक्षा की फोटो लें या चुनें' : 'Tap to capture or select a classroom photo')}</div>
              </div>
            </div>
            
            <div class="sectionlabel">${lang==='hi' ? 'दैनिक उपस्थिति रजिस्टर' : 'Daily Attendance Register'}</div>
            ${kids}
            <button class="btn green" style="margin-top:12px;" onclick="submitAttendanceRoster()">${lang==='hi'?'Confirm attendance':'Confirm attendance'}</button>
            
            <div class="hero" style="background:var(--forest);margin-top:16px">
              <p style="opacity:.85">${t.sumLine}</p>
              <h2 style="font-size:20px">${attendanceSummary}</h2>
              <p style="opacity:.8;font-size:10.5px;margin-top:10px">${lang==='hi' ? 'दिन की समीक्षा स्क्रीन से जाँचें और भेजें →' : 'Review and submit from the Day Review screen →'}</p>
            </div>
          </div>
        </div>
        ${nav('home')}
      </div>
    `;
  },

  ece(){
    const t = T[lang];
    const online = isOnline();
    const attendanceGateHtml = !dailyState.attendance_confirmed
      ? `<div style="background:var(--rl);border:1px solid var(--red);border-radius:10px;padding:10px;margin-bottom:12px;font-size:11px;font-weight:800;color:var(--red);">${lang==='hi'?'Confirm attendance before starting the activity.':'Confirm attendance before starting the activity.'}</div>`
      : '';
    const activityActionHtml = currentActivity ? `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;">
        <button class="btn ghost" style="border-color:var(--green);color:var(--green);" onclick="startActivitySession()">${dailyState.activity_started ? 'Activity started' : 'Start activity'}</button>
        <button class="btn green" onclick="completeActivitySession()">${dailyState.activity_completed ? 'Activity done' : 'Mark activity done'}</button>
      </div>
      <div style="background:var(--gl);border:1px solid #cce9d8;border-radius:var(--radius-md);padding:9px 11px;margin:-4px 0 12px;font:var(--text-body-sm);color:var(--green);">
        ${lang === 'hi'
          ? 'पहले गतिविधि शुरू करें। बच्चों की भागीदारी के बाद Activity done दबाएं, फिर Got it या Support दर्ज करें।'
          : 'Start the activity first. Mark done after children participate, then record Got it or Support.'}
      </div>
    ` : '';
    
    const sourceLabel = online 
      ? (lang === 'hi' ? 'स्रोत: ऑनलाइन अनुकूलन (बैकएंड)' : 'Source: Online adaptation (backend)')
      : (lang === 'hi' ? 'स्रोत: लोकल टेम्पलेट (ऑफ़लाइन)' : 'Source: Local template (offline)');
      
    // Voice only for non-PII materials/counts; online + Web Speech only (Req 5).
    const voiceOnline = (typeof navigator !== 'undefined' && navigator.onLine) && isOnline();
    const voiceWarningHtml = voiceOnline
      ? `<button class="btn ghost" style="border-color:var(--green);color:var(--green);margin-bottom:10px;" onclick="go('voice')">${SVG.voice} ${lang === 'hi' ? 'सामग्री / गिनती - आवाज़ (नाम नहीं)' : 'Materials / count - voice (no names)'}</button>`
      : `<div style="background:var(--rl);color:var(--red);border-radius:10px;padding:8px;font-size:9.5px;font-weight:700;margin-bottom:10px;text-align:center;">⚠️ ${lang === 'hi' ? 'ऑफ़लाइन: आवाज़ बंद; टैप/मैनुअल इनपुट करें' : 'Voice requires internet; use tap/manual input'}</div>`;

    const presentChildren = activeChildren.filter(c => c.present);
    const betaIds = currentActivity && currentActivity.macro_cohort_split && Array.isArray(currentActivity.macro_cohort_split.cohort_beta_uuids)
      ? currentActivity.macro_cohort_split.cohort_beta_uuids
      : [];
    const kidsGridHtml = presentChildren.map(c => {
      const record = masteryMap.get(c.childId);
      const flag = record ? record.trajectory_flag : null;
      const initials = c.name[lang].charAt(0).toUpperCase();
      const isBeta = betaIds.includes(c.childId);
      const hasPendingPromotion = pendingPromotions.some((item) => item.child_id === c.childId && item.node_id === activeNode);
      // Two-state mastery model only: Mastered (green) or Needs Attention (red).
      // Any non-mastered trajectory flag (rising/stalled/at_risk/none) collapses
      // to Needs Attention so the grid stays a simple two-state view.
      let color = 'var(--red)';
      let label = lang === 'hi' ? 'ध्यान दें' : 'Needs Attention';
      if (flag === 'mastered') { color = 'var(--green)'; label = lang === 'hi' ? 'सफल' : 'Mastered'; }

      return `
        <div class="avatar-card" role="group" aria-label="${c.name[lang]}, ${label}" 
             style="display:flex;flex-direction:column;align-items:center;padding:10px 6px;border:1.5px solid var(--line);border-radius:var(--r-tile);background:#fff;user-select:none;touch-action:none;min-width:64px;"
             title="${c.name[lang]} (${label})">
          <div class="avatar-circle" style="width:36px;height:36px;border-radius:50%;background:${color};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;position:relative;margin-bottom:6px;">
            ${initials}
            <span style="position:absolute;bottom:-2px;right:-2px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid ${color};"></span>
          </div>
          <button style="border:none;background:transparent;color:var(--ink);font-size:11px;font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;cursor:pointer;min-height:24px;padding:0;" onclick="event.stopPropagation();openChildProfile('${c.childId}')" aria-label="Open ${c.name[lang]} profile">${c.name[lang].split(' ')[0]}</button>
          <span style="font-size:8px;color:var(--muted);">${label}</span>
          ${isBeta ? `<span style="margin-top:4px;font-size:8px;font-weight:700;padding:2px 6px;border-radius:8px;background:var(--pl);color:var(--purple);">${lang === 'hi' ? 'अतिरिक्त सहारा' : 'Extra support'}</span>` : ''}
          ${hasPendingPromotion ? `<span style="margin-top:4px;font-size:8px;font-weight:700;padding:2px 6px;border-radius:8px;background:var(--al);color:var(--amber);">${lang === 'hi' ? 'समीक्षा' : 'Review'}</span>` : ''}
          ${getInsightChip(c.childId)}
          <div style="display:flex;gap:4px;margin-top:7px;width:100%;">
            <button ${dailyState.activity_completed ? '' : 'disabled'} aria-label="Mark ${c.name[lang]} as got it" style="flex:1;border:1px solid var(--green);background:var(--gl);color:var(--green);border-radius:7px;font-size:8px;font-weight:800;padding:5px 2px;opacity:${dailyState.activity_completed ? '1' : '.45'};" onclick="event.stopPropagation();recordObservation('${c.childId}', true)">Got it</button>
            <button ${dailyState.activity_completed ? '' : 'disabled'} aria-label="Mark ${c.name[lang]} for support" style="flex:1;border:1px solid var(--red);background:var(--rl);color:var(--red);border-radius:7px;font-size:8px;font-weight:800;padding:5px 2px;opacity:${dailyState.activity_completed ? '1' : '.45'};" onclick="event.stopPropagation();recordObservation('${c.childId}', false)">Support</button>
          </div>
        </div>
      `;
    }).join('');

    const masteredCount = presentChildren.filter(c => {
      const record = masteryMap.get(c.childId);
      return record && record.trajectory_flag === 'mastered';
    }).length;

    const firedRules = currentActivity && currentActivity.provenance && Array.isArray(currentActivity.provenance.rules_fired)
      ? currentActivity.provenance.rules_fired
      : [];

    const safety_count = firedRules.filter(id => id.startsWith('SAFE_')).length;
    const inclusion_count = firedRules.filter(id => id.startsWith('INC_')).length;

    const rulesMap = new Map(GuardrailEngine.getRules().map(r => [r.rule_id, r]));

    const offlineNoteHtml = (currentActivity && currentActivity.provenance && currentActivity.provenance.generated_offline && firedRules.length === 0)
      ? `<div style="margin-top:10px;font-size:9px;color:var(--amber);font-weight:600;">⚠ ${lang==='hi'?'ऑफ़लाइन टेम्पलेट — गार्डरेल मूल्यांकन नहीं हुआ':'Offline template — guardrail not evaluated'}</div>`
      : '';

    const guardrailHtml = firedRules.length > 0 ? `
      <div class="guardrail-wrapper" style="margin-top:12px;">
        <div onclick="toggleGuardrailPanel(event)" style="background:var(--gl);border:1px solid var(--green);border-radius:20px;padding:8px 12px;font-size:11.5px;font-weight:700;color:var(--green);cursor:pointer;display:inline-flex;align-items:center;gap:6px;user-select:none;">
          🛡 ${safety_count} ${lang==='hi'?'सुरक्षा':'safety'} · ${inclusion_count} ${lang==='hi'?'समावेश':'inclusion'} <span id="gr-arrow">▼</span>
        </div>
        <div id="gr-detail" style="display:none;background:#fcfcfc;border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;box-shadow:0 4px 10px rgba(0,0,0,.05);">
          <div style="margin-bottom:8px;border-bottom:1px solid var(--line);padding-bottom:6px;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;">
            ${lang === 'hi' ? 'लागू सुरक्षा नियम (15 नियमों में से)' : 'ACTIVE SAFETY RULES (FROM 15-RULE LIST)'}
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;">
            ${firedRules.map(ruleId => {
              const rule = rulesMap.get(ruleId) || { type: 'safety', message: ruleId };
              const isSafety = rule.type === 'safety';
              const col = isSafety ? 'var(--amber)' : 'var(--purple)';
              const bg = isSafety ? '#fff9eb' : '#fbfaff';
              return `
                <div style="border-left:3.5px solid ${col};background:${bg};padding:6px 10px;border-radius:6px;font-size:10.5px;">
                  <strong style="color:${col};font-size:9px;display:block;">${ruleId} · ${rule.type.toUpperCase()}</strong>
                  <span style="color:var(--ink);">${rule.message}</span>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      </div>
    ` : '';

    const duoPathHtml = currentActivity && currentActivity.macro_cohort_split && currentActivity.macro_cohort_split.is_split ? `
      <div class="vcard" style="margin-top:12px;border-left-color:var(--green);background:linear-gradient(180deg,#fff,#f9fbfa);">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <div style="border:1px solid var(--line);border-radius:10px;padding:10px;">
            <div style="font-size:9px;font-weight:800;color:var(--green);text-transform:uppercase;margin-bottom:6px;">${lang === 'hi' ? 'पूरी कक्षा' : 'Whole-room path'}</div>
            <div style="font-size:10px;line-height:1.5;">${(currentActivity.path_alpha_core || []).join('<br>')}</div>
          </div>
          <div style="border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--pl);">
            <div style="font-size:9px;font-weight:800;color:var(--purple);text-transform:uppercase;margin-bottom:6px;">${lang === 'hi' ? 'रिकवरी सहारा' : 'Extra support group'}</div>
            <div style="font-size:10px;line-height:1.5;">${(currentActivity.path_beta_remediation || []).join('<br>')}</div>
            <div style="margin-top:8px;font-size:8px;color:var(--muted);">${lang === 'hi' ? 'बच्चे' : 'Children'}: ${presentChildren.filter((child) => betaIds.includes(child.childId)).map((child) => child.name[lang].split(' ')[0]).join(', ')}</div>
          </div>
        </div>
      </div>
    ` : '';

    const reflectionActionHtml = pendingPromotions.length > 0 ? `
      <button class="btn outline" style="margin-top:10px;" onclick="openReflectionModal()">
        ${lang === 'hi' ? `सत्र समीक्षा (${pendingPromotions.length})` : `Session review (${pendingPromotions.length})`}
      </button>
    ` : '';

    return `
      <div class="screen active">${statusbar(nowClock())}${header()}
        <div class="scroll">
          <div class="body">
            ${kw(t.eceKw,'--purple')}
            <div class="sub">${t.eceSub}</div>
            ${workflowStrip(dailyState.activity_completed ? 'obs' : 'act')}
            ${attendanceGateHtml}
            ${activityActionHtml}
            ${renderActivityFocusStrip(currentActivity, t.eceDesc)}
            ${renderActivityBrief(
              currentActivity,
              sourceLabel,
              { guardrailHtml, offlineNoteHtml },
              { title: t.eceGame, age: t.eceAge, desc: t.eceDesc, pick: t.ecePick }
            )}
            <button class="btn ghost" style="border-color:var(--green);color:var(--green);margin:0 0 12px;" onclick="loadECEActivity()" id="btn-load-activity">
              🎯 ${lang === 'hi' ? 'कमरे के अनुसार गतिविधि बदलें' : 'Adapt activity for this room'}
            </button>

async function openHeadcountModel(){
  let input = document.getElementById('attendance-photo-input');
  if (!input) {
    input = document.createElement('input');
    input.id = 'attendance-photo-input';
    input.type = 'file';
    input.accept = 'image/*';
    input.capture = 'environment';
    input.style.display = 'none';
    document.body.appendChild(input);
  }

  input.onchange = async () => {
    const file = input.files && input.files[0];
    input.value = '';
    if (!file) return;

    const titleEl = document.getElementById('camline-title');
    const subtitleEl = document.getElementById('camline-subtitle');
    const btnEl = document.getElementById('camline-btn');
    if (titleEl) titleEl.textContent = lang === 'hi' ? 'फोटो लोड हो रही है...' : 'Loading photo...';
    if (subtitleEl) subtitleEl.textContent = lang === 'hi' ? 'बच्चों की गिनती हो रही है' : 'Detecting children on this device...';

    const img = new Image();
    const url = URL.createObjectURL(file);

    img.onload = async () => {
      try {
        const canvas = document.createElement('canvas');
        const maxSide = 960;
        const width = img.naturalWidth || img.width || maxSide;
        const height = img.naturalHeight || img.height || maxSide;
        const scale = Math.min(1, maxSide / Math.max(width, height));
        canvas.width = Math.max(1, Math.round(width * scale));
        canvas.height = Math.max(1, Math.round(height * scale));

        const ctx = canvas.getContext('2d');
        if (!ctx) throw new Error('Canvas not available');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        const result = await AURA_API.countHeadsByCamera(canvas);
        if (!result.success) throw new Error(result.message || 'Vision model failed');

        const expected = activeChildren.filter(c => c.present).length;
        const count = Number(result.count || 0);
        const confidence = Number(result.confidence || 0);
        await saveDailyState({
          photo_count: count,
          photo_confidence: confidence,
          photo_verified_at: new Date().toISOString()
        });

        if (btnEl) {
          btnEl.style.background = count === expected ? '#143f2b' : '#5f3514';
          btnEl.style.border = count === expected ? '1px solid var(--green)' : '1px solid var(--amber)';
        }
        if (titleEl) titleEl.textContent = lang === 'hi' ? `फोटो से गिना: ${count}` : `Photo count: ${count} children`;
        if (subtitleEl) {
          subtitleEl.textContent = count === expected
            ? (lang === 'hi' ? `रजिस्टर से मेल खाता है (${Math.round(confidence * 100)}%)` : `Matches attendance (${Math.round(confidence * 100)}% confidence)`)
            : (lang === 'hi' ? `अंतर: फोटो ${count}, रजिस्टर ${expected}` : `Mismatch: photo ${count}, attendance ${expected}`);
        }
        showBktToast(count === expected
          ? (lang === 'hi' ? 'फोटो गिनती मेल खाती है' : 'Photo count matches attendance')
          : (lang === 'hi' ? 'फोटो और रजिस्टर में अंतर है' : 'Photo count differs from attendance'));
      } catch (err) {
        console.warn('[Headcount photo failed]', err);
        if (titleEl) titleEl.textContent = lang === 'hi' ? 'फोटो गिनती नहीं हो सकी' : 'Photo count could not run';
        if (subtitleEl) subtitleEl.textContent = lang === 'hi' ? 'उपस्थिति फिर भी मैनुअल रूप से सुरक्षित है' : 'Attendance is still saved manually; try another photo';
        showBktToast(lang === 'hi' ? 'फोटो गिनती नहीं हो सकी' : 'Photo count could not run');
      } finally {
        URL.revokeObjectURL(url);
      }
    };

    img.onerror = () => {
      URL.revokeObjectURL(url);
      showBktToast(lang === 'hi' ? 'फोटो लोड नहीं हुई' : 'Photo could not be loaded');
    };

    img.src = url;
  };

  input.click();
}

async function handleAuthSubmit(mode) {
  const t = T[lang];
  if (mode === 'signup') {
    const nameInput = document.getElementById('auth-name');
    const idInput = document.getElementById('auth-id');
    const centreInput = document.getElementById('auth-centre');
    const pinInput = document.getElementById('auth-pin');

    const name = nameInput ? nameInput.value.trim() : '';
    const workerId = idInput ? idInput.value.trim() : '';
    const centre = centreInput ? centreInput.value.trim() : '';
    const pin = pinInput ? pinInput.value.trim() : '';

    if (!name || !workerId || !centre || pin.length !== 4 || isNaN(pin)) {
      alert(lang === 'hi' ? 'कृपया सभी फ़ील्ड सही से भरें और 4-अंकीय पिन दर्ज करें।' : 'Please fill all fields correctly and enter a 4-digit PIN.');
      return;
    }

    const success = await AURA_DB.setupIdentity({ name, id: workerId }, pin, centre, lang);
    if (success) {
      alert(t.msgSuccess);
      authMode = 'login';
      await initIdentity();
      render();
    } else {
      alert(lang === 'hi' ? 'डाटाबेस त्रुटी' : 'Database registration failed');
    }
  } else if (mode === 'login') {
    const idInput = document.getElementById('auth-id');
    const pinInput = document.getElementById('auth-pin');
    const workerId = idInput ? idInput.value.trim() : '';
    const pin = pinInput ? pinInput.value.trim() : '';
    
    if (!workerId || pin.length !== 4 || isNaN(pin)) {
      const errorDiv = document.getElementById('auth-error');
      if (errorDiv) errorDiv.style.display = 'block';
      return;
    }

    const storedIdentity = await AURA_DB.getIdentity();
    if (!storedIdentity) {
      alert(lang === 'hi' ? 'कोई प्रोफ़ाइल नहीं मिली। कृपया पहले साइनअप करें।' : 'No profile found. Please Sign Up first.');
      authMode = 'signup';
      render();
      return;
    }

    const isPinValid = await AURA_DB.verifyPin(pin);
    const storedWorkerId = storedIdentity.worker ? storedIdentity.worker.id : '';

    if (workerId.toUpperCase() === storedWorkerId.toUpperCase() && isPinValid) {
      await initIdentity();
      jump('shell');
    } else {
      const errorDiv = document.getElementById('auth-error');
      if (errorDiv) errorDiv.style.display = 'block';
    }
  }
}

async function initIdentity() {
  const storedIdentity = await AURA_DB.getIdentity();
  if (storedIdentity) {
    activeWorker = storedIdentity.worker;
    activeCentre = storedIdentity.centre;
    if (storedIdentity.worker && storedIdentity.worker.name) {
    }
    try {
      const kids = await AURA_API.getChildren(activeCentre);
      activeChildren = kids.map(c => ({
        childId: c.id || c.child_id || Math.random().toString(36).slice(2),
        name: {
          en: c.name || c.nameEn || 'Child',
          hi: c.nameHi || c.name || 'बच्चा'
        },
        age: {
          en: c.age || (c.age_months ? c.age_months + ' months' : '3 years'),
          hi: c.age || (c.age_months ? c.age_months + ' महीने' : '3 साल')
        },
        age_months: c.age_months || 36,
        needs: Array.isArray(c.needs) ? c.needs : [],
        present: true
      }));
      window.activeChildren = activeChildren;

      
      await loadMasteryMap();
      
      syncQueueSize = (await AURA_DB.getPendingSync()).length;
      await refreshPendingPromotions();
    } catch(e) {
      console.error('Kids roster initialization failed:', e);
    }
  }
}

async function loadMasteryMap() {
  const records = await MasteryStore.getAllByNode(activeNode);
  const allEntries = await Promise.all(activeChildren.map(child => BKTEngine.getAllChildMastery(child.childId)));
  allChildMasteryRecords = allEntries.flat();
  masteryMap = new Map();
  for (const child of activeChildren) {
    masteryMap.set(child.childId, null);
  }
  for (const record of records) {
    if (masteryMap.has(record.child_id)) {
      masteryMap.set(record.child_id, record);
    }
  }
  await refreshPendingPromotions();
  await buildRecoveryInsights(activeChildren.filter(c => c.present));
}

async function updateBktStatus(childId, isCorrect) {
  try {
    const record = await BKTEngine.tapMastery(childId, activeNode, isCorrect);
    if (record.committed) {
      masteryMap.set(childId, record);
    }
    allChildMasteryRecords = await BKTEngine.getAllChildMastery(childId).then(records => {
      const others = allChildMasteryRecords.filter(item => item && item.child_id !== childId);
      return others.concat(records);
    });
    await refreshPendingPromotions();
    await buildRecoveryInsights(activeChildren.filter(c => c.present));
    await saveDailyState({ observations_recorded: true, reflection_checked: pendingPromotions.length === 0 });
    
    syncQueueSize = (await AURA_DB.getPendingSync()).length;
    
    const nameStr = getChildName(childId);
    let statusMsg;
    if (record.pending_promotion) {
      statusMsg = lang === 'hi' ? `${nameStr}: समीक्षा के लिए लंबित` : `${nameStr}: pending review`;
    } else {
      statusMsg = record.trajectory_flag === 'mastered'
        ? (lang === 'hi' ? `${nameStr}: सफल ✓` : `${nameStr}: Mastered ✓`)
        : (lang === 'hi' ? `${nameStr}: ध्यान दें ⚠️` : `${nameStr}: Needs Attention ⚠️`);
    }
    
    showBktToast(statusMsg);
    render();
  } catch (err) {
    console.error('[BKT Update failed]', err);
    showBktToast(lang==='hi' ? 'सिस्टम त्रुटि: पुनः प्रयास करें' : 'System error: please retry');
  }
}

    toast.style.cssText = "position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1c1c1c;color:#fff;padding:8px 16px;border-radius:10px;font-size:12px;font-weight:700;z-index:100;box-shadow:0 4px 10px rgba(0,0,0,.3);pointer-events:none;";
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.display = 'block';
  setTimeout(() => { toast.style.display = 'none'; }, 2000);
}

  const redFlagsCount = Object.values(dssAnswers).filter(v => v === true).length;
  const resultDiv = document.getElementById('dss-result-panel');
  if (!resultDiv) return;

  const resultType = redFlagsCount === 0 ? 'typical' : (redFlagsCount === 1 ? 'monitor' : 'refer');

  if (dssSelectedChild) {
    dssResults[dssSelectedChild.childId] = {
      result: resultType,
      redFlags: redFlagsCount,
      timestamp: new Date().toISOString()
    };
    AURA_DB.set('dssResults', dssResults);
    saveDailyState({ dss_completed: true });
  }

  const firedFlags = dssQuestions.filter(q => dssAnswers[q.item_id] === true);
  const childBanner = dssSelectedChild ? `
    <div style="background:var(--pl);border-radius:10px;padding:10px;margin-bottom:12px;display:flex;align-items:center;gap:10px;">

        <div style="font-size:10px;color:var(--muted);">${dssSelectedChild.age[lang]}</div>
      </div>
    </div>
  ` : '';

  const firedHtml = firedFlags.length ? `
    <div style="background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:12px;text-align:left;">
      <div style="font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;margin-bottom:6px;">${lang==='hi'?'लागू लाल झंडे':'Red flags fired'} (${firedFlags.length})</div>
      ${firedFlags.map(q => `<div style="font-size:10.5px;color:var(--red);line-height:1.4;margin-bottom:4px;">- ${q.milestone_due ? '['+q.milestone_due+'] ' : ''}${q.question}</div>`).join('')}

  let resultHtml = childBanner;

    resultHtml += `

        <span style="font-size:32px;display:block;margin-bottom:8px;">✅</span>

        <div style="font-size:11.5px;color:var(--green);margin-top:6px;line-height:1.4;">
          ${lang === 'hi' ? 'कोई लाल झंडा नहीं मिला। विकास सामान्य है। नियमित अंतराल पर दोबारा जांच करें।' : '0 Red Flags detected. Child is tracking normally. Re-evaluate during regular screening cycle.'}
        </div>
      </div>
    `;
  } else if (redFlagsCount === 1) {
    resultHtml += `
      <div style="background:var(--al);border:2px solid var(--amber);border-radius:12px;padding:16px;text-align:center;">
        <span style="font-size:32px;display:block;margin-bottom:8px;">⚠️</span>
        <div style="font-size:16px;font-weight:800;color:var(--amber);">${lang === 'hi' ? 'निगरानी रखें (Monitor)' : 'Monitor Closely'}</div>
        <div style="font-size:11.5px;color:var(--amber);margin-top:6px;line-height:1.4;">
          ${lang === 'hi' ? '1 लाल झंडा मिला। बच्चे की बारीकी से निगरानी करें। 2 सप्ताह बाद दोबारा स्क्रीन करें।' : '1 Red Flag detected. Developmental deviation observed. Monitor closely and re-evaluate in 2 weeks.'}
        </div>
      </div>
    `;
  } else {
    resultHtml += `
      <div style="background:var(--rl);border:2px solid var(--red);border-radius:12px;padding:16px;text-align:center;">
        <span style="font-size:32px;display:block;margin-bottom:8px;">🚨</span>

async function loadECEActivity() {
  if (!dailyState.attendance_confirmed) {
    showBktToast(lang==='hi' ? 'Confirm attendance before adapting activity' : 'Confirm attendance before adapting activity');
    return;
  }
  const btn = document.getElementById('btn-load-activity');
  if (btn) { btn.disabled = true; btn.textContent = lang==='hi' ? '⏳ अनुकूलन जारी...' : '⏳ Adapting...'; }

  const present = activeChildren.filter(c => c.present);
  const childProfiles = present.map(c => ({ child_id: c.childId, age_months: c.age_months || 36, needs: c.needs || [] }));
  const roomContext = buildRoomContext(childProfiles);

  const derivedBand = deriveBandClient(childProfiles);
  const derivedNode = deriveNodeFromBand(derivedBand);
  const payload = { node_id: derivedNode, age_band_months: derivedBand, child_profiles: childProfiles, context: roomContext };
  const activityCacheKey = getActivityCacheKey(payload);
  const childMasteryEntries = await Promise.all(
    present.map(async (child) => [child.childId, await BKTEngine.getAllChildMastery(child.childId)])
  );
  const childMasteryMap = new Map(childMasteryEntries);

  // Local retrieval engine (runs on device server — no cloud LLM, works offline too)
  try {
    const resp = await fetch('/api/activity/next', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
    });
    if (!resp.ok) throw new Error('retrieval engine error');
    const baseActivity = normalizeActivity(await resp.json(), 'activity_bank', 'none');
    const recoveryResult = await buildRecoveryActivity({ baseActivity, payload, presentChildren: present, childMasteryMap });
    currentActivity = recoveryResult.activity;
    recoveryCohort = recoveryResult.cohort;
    cacheResolvedActivity(activityCacheKey, currentActivity);
    activeNode = currentActivity.milestone_targeted || derivedNode;
    window.currentActivity = currentActivity;
    rememberDomain(currentActivity.targeted_domain);
    await buildRecoveryInsights(present);
    await saveDailyState({ activity_ready: true, activity_started: false, activity_completed: false, observations_recorded: false, reflection_checked: pendingPromotions.length === 0 });
    render();
  } catch (err) {
    console.warn('[Activity retrieval failed -> offline fallback]', err);
    activeNode = derivedNode;
    const baseActivity = await resolveOfflineActivity(payload, activityCacheKey);
    const recoveryResult = await buildRecoveryActivity({ baseActivity, payload, presentChildren: present, childMasteryMap });
    currentActivity = recoveryResult.activity;
    recoveryCohort = recoveryResult.cohort;
    window.currentActivity = currentActivity;
    rememberDomain(currentActivity.targeted_domain);
    await buildRecoveryInsights(present);
    await saveDailyState({ activity_ready: true, activity_started: false, activity_completed: false, observations_recorded: false, reflection_checked: pendingPromotions.length === 0 });
    render();
  }
  if (btn) { btn.disabled = false; btn.textContent = lang === 'hi' ? '🎯 गतिविधि अनुकूलित करें (Adapt)' : '🎯 Adapt Activity for Room'; }
}

function normalizeActivity(a, sourceDefault, tier) {
  a = a || {};
  const prov = a.provenance || {};
  const inclusionMods = normalizeInclusionMods(a.inclusion_modifications || prov.inclusion_modifications);
  return {
    activity_id: a.activity_id || a.id || 'ACT-UNKNOWN',
    source: a.source || sourceDefault,
    targeted_domain: a.targeted_domain || a.domain || 'socio_emotional',
    age_band_months: a.age_band_months || deriveBandClient(activeChildren.map(c => ({ age_months: c.age_months || 36 }))),
    milestone_targeted: a.milestone_targeted || a.milestone || activeNode,
    adapted_title: a.adapted_title || a.title || (lang === 'hi' ? 'गतिविधि' : 'Activity'),
    step_by_step_instructions: Array.isArray(a.step_by_step_instructions) ? a.step_by_step_instructions : (Array.isArray(a.steps) ? a.steps : []),
    required_materials: a.required_materials || a.materials || [],
    keywords: Array.isArray(a.keywords) ? a.keywords : [],
    inclusion_tags: Array.isArray(a.inclusion_tags) ? a.inclusion_tags : [],
    recent_domains: Array.isArray(a.recent_domains) ? a.recent_domains : [],
    safety_guard_applied: a.safety_guard_applied != null ? a.safety_guard_applied : true,
    inclusion_modifications: inclusionMods,
    macro_cohort_split: a.macro_cohort_split || null,
    path_alpha_core: Array.isArray(a.path_alpha_core) ? a.path_alpha_core : null,
    path_beta_remediation: Array.isArray(a.path_beta_remediation) ? a.path_beta_remediation : null,
    remediation_domain: a.remediation_domain || null,
    provenance: {
      rules_fired: Array.isArray(prov.rules_fired) ? prov.rules_fired : [],
      generated_offline: !!prov.generated_offline,
      cache_key: prov.cache_key || '',
      fallback_tier: prov.fallback_tier || tier || 'none'
    },
    fallback_tier: a.fallback_tier || tier
  };
}

function normalizeInclusionMods(mods) {
  if (!mods) return { vast_parameter: 'none', instruction_override: '' };
  if (Array.isArray(mods)) {
    return {
      vast_parameter: 'attunement',
      instruction_override: mods.filter(Boolean).map(String).join(' ')
    };
  }
  if (typeof mods === 'string') return { vast_parameter: 'attunement', instruction_override: mods };
  if (typeof mods === 'object') {
    return {
      vast_parameter: typeof mods.vast_parameter === 'string' ? mods.vast_parameter : 'none',
      instruction_override: typeof mods.instruction_override === 'string' ? mods.instruction_override : ''
    };
  }
  return { vast_parameter: 'none', instruction_override: '' };
}

async function getActivityBank() {
  if (activityBankCache) return activityBankCache;
  const resp = await fetch('/data/activity_bank.json');
  if (!resp.ok) throw new Error('activity bank unavailable');
  const data = await resp.json();
  activityBankCache = Array.isArray(data) ? data : [];
  return activityBankCache;
}

function scoreLocalActivity(activity, payload) {
  let score = 0;
  const context = payload.context || {};
  if (activity.age_band_months === payload.age_band_months) score += 5;
  if (activity.milestone_targeted && String(activity.milestone_targeted).toLowerCase().includes(String(payload.node_id).toLowerCase())) score += 2;
  const materials = Array.isArray(activity.required_materials) ? activity.required_materials : [];
  const wantedMaterials = Array.isArray(context.materials) ? context.materials : [];
  score += wantedMaterials.filter(m => materials.includes(m)).length;
  if (context.needs_attention_count > 0 && activity.targeted_domain !== 'cognitive') score += 1;
  return score;
}

function adaptLocalActivity(activity, payload, tier) {
  const normalized = normalizeActivity(activity, 'local_template', tier);
  const rules = [];
  const profiles = payload.child_profiles || [];
  const hasInclusionNeed = profiles.some(c => Array.isArray(c.needs) && c.needs.length > 0);
  const hasUnderTwo = profiles.some(c => Number(c.age_months || 0) < 24);
  if (hasInclusionNeed) rules.push('INC_ATTUNE_01');
  if (hasUnderTwo && normalized.required_materials.some(m => /bead|pebble|stone|seed/i.test(String(m)))) rules.push('SAFE_CHOKE_01');
  normalized.source = 'local_template';
  normalized.age_band_months = payload.age_band_months || normalized.age_band_months;
  normalized.provenance = {
    ...normalized.provenance,
    generated_offline: true,
    rules_fired: Array.from(new Set([...(normalized.provenance.rules_fired || []), ...rules]))
  };
  normalized.fallback_tier = tier || 'local_template';
  if (hasInclusionNeed && !normalized.inclusion_modifications.instruction_override) {
    normalized.inclusion_modifications = {
      vast_parameter: 'attunement',
      instruction_override: 'Accept gesture responses and give extra wait time for children who need a non-verbal path.'
    };
  }
  return normalized;
}

async function localActivityFromBank(payload, tier) {
  try {
    const bank = await getActivityBank();
    const candidates = bank
      .filter(a => a && Array.isArray(a.step_by_step_instructions))
      .sort((a, b) => scoreLocalActivity(b, payload) - scoreLocalActivity(a, payload));
    const choice = candidates[0];
    if (!choice) return getSafeDefaultActivity();
    return adaptLocalActivity(choice, payload, tier);
  } catch (err) {
    console.warn('[Local activity bank unavailable -> safe fallback]', err);
    return getSafeDefaultActivity();
  }
}

function cacheResolvedActivity(cacheKey, activity) {
  try {
    localStorage.setItem(`${ACTIVITY_CACHE_PREFIX}${cacheKey}`, JSON.stringify(activity));
  } catch (err) {
    console.warn('[Activity cache write skipped]', err);
  }
}

function getCachedActivity(cacheKey) {
  try {
    const raw = localStorage.getItem(`${ACTIVITY_CACHE_PREFIX}${cacheKey}`);
    if (!raw) return null;
    return normalizeActivity(JSON.parse(raw), 'activity_cache', 'last_cache');
  } catch (err) {
    console.warn('[Activity cache read failed]', err);
    return null;
  }
}

function getSafeDefaultActivity() {
  return {
    activity_id: 'ACT-SAFE-DEFAULT-01',
    source: 'safe_default',
    targeted_domain: 'socio_emotional',
    age_band_months: deriveBandClient(activeChildren.map(c => ({ age_months: c.age_months || 36 }))),
    milestone_targeted: activeNode,
    adapted_title: 'Shared play circle',
    step_by_step_instructions: [
      'Seat the children in a circle.',
      'Use claps, voice, or hand gestures to invite turn-taking.',
      'Allow gesture or assisted responses for children who need extra time.'
    ],
    required_materials: roomMaterials.slice(0, 3),
    safety_guard_applied: true,
    inclusion_modifications: { vast_parameter: 'attunement', instruction_override: 'Accept gesture responses and give extra wait time where needed.' },
    provenance: { rules_fired: [], generated_offline: true, cache_key: '', fallback_tier: 'safe_default' },
    fallback_tier: 'safe_default'
  };
}

async function getOfficialFallbackActivity(payload) {
  const bank = await getActivityBank();
  const exact = bank.find((activity) => activity.age_band_months === payload.age_band_months);
  return normalizeActivity(exact || getSafeDefaultActivity(), 'official_unmodified', 'official_unmodified');
}

async function resolveOfflineActivity(payload, cacheKey) {
  const cached = getCachedActivity(cacheKey);
  if (cached) return cached;
  try {
    return await localActivityFromBank(payload, 'safe_default');
  } catch (err) {
    console.warn('[Safe default lookup failed -> official fallback]', err);
    return getOfficialFallbackActivity(payload);
  }
}


async function loadDssQuestions() {
  if (dssQuestions.length > 0) return;
  const cacheKey = 'dss-source::v1';
  try {
    const r = await fetch('/data/dss.json');
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    const allItems = Array.isArray(data.items) ? data.items : [];
    localStorage.setItem(cacheKey, JSON.stringify(allItems));
    // UI stays child-only: Part B only, while the source dataset remains explicit.
    dssQuestions = allItems.filter(item => item && item.part === 'B');
    dssPlaceholder = false;
  } catch (err) {
    console.warn('[DSS loading failed - using cached authoritative dataset only]', err);
    try {
      const cached = JSON.parse(localStorage.getItem(cacheKey) || '[]');
      dssQuestions = Array.isArray(cached) ? cached.filter(item => item && item.part === 'B') : [];

function demoSeries(childIndex, domain) {
  const needsSupport = childIndex < 5;
  const steady = childIndex >= 5 && childIndex < 10;
  if (needsSupport && (domain === 'motor_physical' || domain === 'language')) {
    return [0.50, 0.48, 0.46, 0.44, 0.43, 0.42, 0.40, 0.39, 0.38, 0.37];
  }
  if (steady) return [0.43, 0.46, 0.49, 0.52, 0.55, 0.58, 0.61, 0.64, 0.67, 0.70];
  return [0.56, 0.60, 0.64, 0.68, 0.72, 0.76, 0.80, 0.84, 0.87, 0.90];
}

function trajectoryFromSeries(series) {
  const last = series[series.length - 1] || 0.4;
  if (last >= 0.8) return 'mastered';
  const tail = series.slice(-4);
  const deltas = tail.slice(1).map((value, idx) => value - tail[idx]);
  if (deltas.length >= 3 && deltas.every(delta => delta < -0.01) && last < 0.5) return 'at_risk';
  if (deltas.length >= 3 && deltas.every(delta => Math.abs(delta) < 0.02) && last < 0.8) return 'stalled';
  return 'rising';
}

async function seedDemoData() {

  if (!ok) return;

  const centreId = 'AWC_DEMO_10DAY';
  const children = DEMO_CHILDREN.map(([id, name, nameHi, ageMonths, needs]) => ({
    id,
    name,
    nameHi,

    age_months: ageMonths,
    needs
  }));
  const demoIds = children.map((child) => child.id);
  await AURA_DB.clearDemoData(demoIds);
  await Promise.all(demoIds.flatMap((childId) => DEMO_DOMAIN_NODES.map(([, nodeId]) => MasteryStore.delete(childId, nodeId))));

  await AURA_DB.setupIdentity({ name: 'Demo AWW', id: 'AWW_DEMO_01' }, '1234', centreId, lang);
  await AURA_DB.set('children', children);

  const now = Date.now();
  for (let childIndex = 0; childIndex < children.length; childIndex++) {
    const child = children[childIndex];
    for (const [domain, nodeId] of DEMO_DOMAIN_NODES) {
      const series = demoSeries(childIndex, domain);

          demo_seed: true
        });

      await MasteryStore.put({
        child_node_key: `${child.id}|${nodeId}`,

        node_id: nodeId,
        p_mastery: series[series.length - 1],
        last_updated: new Date(now - 86400000).toISOString(),

        observation_count: series.length,

      demo_seed: true
    });
  }

  dssResults = {
    'demo-child-01': { result: 'monitor', redFlags: 1, timestamp: new Date(now - 2 * 86400000).toISOString() },
    'demo-child-02': { result: 'refer', redFlags: 2, timestamp: new Date(now - 3 * 86400000).toISOString() },

  };

// Real Web Speech for NON-PII materials/counts only (Req 5). Online-only; graceful fallbacks; no fake transcript/confidence.
function startVoiceCapture(){
  const online = (typeof navigator !== 'undefined' && navigator.onLine) && isOnline();
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const status = document.getElementById('voice-status');
  const out = document.getElementById('voice-transcript');
  if (!online){ if(status) status.textContent = lang==='hi'?'आवाज़ के लिए इंटरनेट चाहिए; टैप/मैनुअल इनपुट करें।':'Voice requires internet; use tap/manual input.'; return; }
  if (!SR){ if(status) status.textContent = lang==='hi'?'इस डिवाइस पर आवाज़ समर्थित नहीं।':'Voice not supported on this device.'; return; }
  try {
    voiceRecognition = new SR();
    voiceRecognition.lang = lang==='hi' ? 'hi-IN' : 'en-IN';
    voiceRecognition.interimResults = true;
    voiceRecognition.maxAlternatives = 1;
    if(status) status.textContent = lang==='hi'?'सुन रहे हैं…':'Listening…';
    voiceRecognition.onresult = (e) => {
      let txt = '';
      for (let i=0;i<e.results.length;i++) txt += e.results[i][0].transcript;
      if(out){ out.textContent = txt; out.style.color = 'var(--ink)'; }
    };
    voiceRecognition.onerror = (e) => { if(status) status.textContent = (lang==='hi'?'त्रुटि: ':'Error: ') + (e.error||''); };
    voiceRecognition.onend = () => {
      if(status) status.textContent = lang==='hi'?'समाप्त। दोबारा बोलने के लिए टैप करें।':'Done. Tap to speak again.';
      const transcript = out ? out.textContent.trim() : '';
      if (transcript && transcript !== '…') {
        const tokens = transcript.toLowerCase().split(/[\s,،।]+/).filter(tok => tok.length > 2);
        if (tokens.length > 0) {
          roomMaterials = [...new Set([...roomMaterials, ...tokens])];
          showBktToast(lang==='hi' ? 'सामग्री अपडेट ✓' : 'Room materials updated ✓');
        }
      }
    };
    voiceRecognition.start();
  } catch(err){ if(status) status.textContent = lang==='hi'?'आवाज़ शुरू नहीं हो सकी।':'Could not start voice.'; }
}

  }).join('');

async function confirmPendingPromotions() {
  const checkboxes = Array.from(document.querySelectorAll('#reflection-list input[type="checkbox"][data-promotion-id]'));
  const confirmedIds = checkboxes.filter((box) => box.checked).map((box) => box.getAttribute('data-promotion-id'));
  const rejectedIds = checkboxes.filter((box) => !box.checked).map((box) => box.getAttribute('data-promotion-id'));

  const confirmedItems = pendingPromotions.filter((item) => confirmedIds.includes(item.id));
  for (const item of confirmedItems) {
    if (item && item.candidate_record) {
      await MasteryStore.put(item.candidate_record);
      masteryMap.set(item.child_id, item.candidate_record);
    }
  }

  await AURA_DB.resolvePendingPromotions(confirmedIds, 'confirmed');
  await AURA_DB.resolvePendingPromotions(rejectedIds, 'rejected');
  await refreshPendingPromotions();
  await buildRecoveryInsights(activeChildren.filter(c => c.present));
  await saveDailyState({ reflection_checked: true });
  closeReflectionModal();
  showBktToast(lang === 'hi'
    ? `पुष्टि: ${confirmedIds.length}, रोके गए: ${rejectedIds.length}`
    : `Confirmed: ${confirmedIds.length}, held back: ${rejectedIds.length}`);
  render();
}
